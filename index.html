<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SL Synced DJ Deck</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #040508;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      padding: 14px;
      overflow: hidden;
      user-select: none;
      cursor: pointer;
    }

    .deck-frame {
      width: 100%;
      height: 100%;
      border: 4px solid #ff0044;
      border-radius: 22px;
      background-color: #0a0b12;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 16px 22px;
      position: relative;
      box-shadow: 0 0 25px rgba(255, 0, 68, 0.35);
      transition: box-shadow 0.15s ease, border-color 0.15s ease;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 0 4px;
    }

    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 16px;
      background-color: #ff0044;
      border-radius: 20px;
      box-shadow: 0 0 15px rgba(255, 0, 68, 0.6);
    }

    .pulse-dot {
      width: 10px;
      height: 10px;
      background-color: #ffffff;
      border-radius: 50%;
    }

    .station-text {
      color: #ffffff;
      font-size: 1rem;
      letter-spacing: 2px;
      font-weight: bold;
    }

    .sync-counter {
      font-size: 1.05rem;
      color: #b537f2;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .mid-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 0 10px;
      gap: 20px;
      margin: 4px 0;
    }

    #title {
      font-size: 2.1rem;
      font-weight: 900;
      color: #ffffff;
      line-height: 1.15;
      text-transform: uppercase;
      word-break: break-word;
      text-shadow: 0 0 16px rgba(181, 55, 242, 0.8);
      flex: 1;
    }

    .gg-emblem-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 76px;
      height: 76px;
      min-width: 76px;
      margin-right: 25px;
      border-radius: 50%;
      border: 3px solid #ff0044;
      background: radial-gradient(circle at 35% 35%, #3d0a47 0%, #0d0718 100%);
      box-shadow: 0 0 20px rgba(255, 0, 68, 0.7), inset 0 0 15px rgba(157, 0, 255, 0.6);
      position: relative;
      transform-origin: center center;
      transition: transform 0.08s ease-out;
    }

    .gg-emblem-wrap::before {
      content: '';
      position: absolute;
      width: 88px;
      height: 88px;
      border-radius: 50%;
      border: 2px dashed #9d00ff;
      opacity: 0.8;
    }

    .gg-emblem-text {
      font-family: 'Arial Black', Impact, sans-serif;
      font-size: 2.1rem;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 2px;
      text-shadow: 0 0 10px #ff0044, 0 0 20px #9d00ff, 0 0 30px #00f0ff;
    }

    #visualStage {
      width: 100%;
      height: 250px;
      background-color: #040508;
      border: 2px solid #23192d;
      border-radius: 12px;
      display: block;
    }

    .progress-wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 7px;
      background-color: #181422;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(to right, #ff0044, #9d00ff);
      border-radius: 4px;
      transition: width 0.3s linear;
    }

    .bottom-info {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 0.95rem;
      font-weight: bold;
      color: #79718a;
    }

    #clickOverlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(4, 5, 8, 0.94);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 20px;
      z-index: 100;
    }

    .click-btn {
      background: linear-gradient(135deg, #ff0044, #9d00ff);
      color: #ffffff;
      font-size: 1.9rem;
      padding: 18px 38px;
      border-radius: 18px;
      border: 3px solid #ffffff;
      text-transform: uppercase;
      font-weight: 900;
      letter-spacing: 2px;
      box-shadow: 0 0 35px rgba(255, 0, 68, 0.8);
    }
  </style>
</head>
<body onclick="handleUserUnlock()">

  <div class="deck-frame" id="frameBox">
    <div id="clickOverlay" style="display: none;">
      <div class="click-btn">🔊 CLICK TO TUNE IN</div>
    </div>

    <div class="top-bar">
      <div class="badge-pill">
        <div class="pulse-dot"></div>
        <span class="station-text">LIVE STREAM</span>
      </div>
      <div class="sync-counter" id="timeDisplay">0:00 / 0:00</div>
    </div>

    <div class="mid-header-row">
      <div id="title">JUKEBOX STANDBY</div>
      <div class="gg-emblem-wrap" id="ggBadge">
        <span class="gg-emblem-text">GG</span>
      </div>
    </div>

    <canvas id="visualStage" width="800" height="340"></canvas>

    <div class="progress-wrap">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
      <div class="bottom-info">
        <span id="status">SYNCHRONIZED BROADCAST ACTIVE</span>
        <span>GG AUDIO ENGINE</span>
      </div>
    </div>
  </div>

  <audio id="player" preload="auto"></audio>

  <script>
    var params = new URLSearchParams(window.location.search);
    var audioUrl = params.get('url');
    var songName = params.get('name') || "Now Playing";
    var startTime = parseFloat(params.get('t') || "0");

    var audio = document.getElementById('player');
    var titleEl = document.getElementById('title');
    var statusEl = document.getElementById('status');
    var timeDisplay = document.getElementById('timeDisplay');
    var progressFill = document.getElementById('progressFill');
    var overlayEl = document.getElementById('clickOverlay');
    var frameBox = document.getElementById('frameBox');
    var ggBadge = document.getElementById('ggBadge');
    var canvas = document.getElementById('visualStage');
    var ctx = canvas.getContext('2d');

    var NUM_BARS = 22;
    var peaks = new Array(NUM_BARS).fill(0);
    var currentHeights = new Array(NUM_BARS).fill(6);
    var smoothedBass = 0;
    var seekDone = false;

    // Real visualizer curve weighting (higher bass on left, rolling mids and tops)
    var barWeights = [
      0.95, 0.92, 0.88, 0.82, 0.78, 0.72, 0.68, 0.62,
      0.58, 0.54, 0.50, 0.48, 0.46, 0.44, 0.42, 0.40,
      0.38, 0.35, 0.32, 0.30, 0.28, 0.25
    ];

    function formatTime(sec) {
      if (isNaN(sec) || sec < 0) return "0:00";
      var h = Math.floor(sec / 3600);
      var m = Math.floor((sec % 3600) / 60);
      var s = Math.floor(sec % 60);
      if (h > 0) {
        return h + ":" + (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
      }
      return m + ":" + (s < 10 ? "0" : "") + s;
    }

    function render(timestamp) {
      ctx.fillStyle = '#040508';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      var isPlaying = !audio.paused && audio.currentTime > 0;
      var t = timestamp * 0.001; // seconds

      // 126 BPM rhythmic beat envelope
      var beat = Math.sin(t * 13.2); 
      var subBeat = Math.cos(t * 6.6);
      var rawKick = Math.max(0, beat * 0.7 + subBeat * 0.3);

      var targetBass = isPlaying ? (rawKick * 170 + 40) : 0;
      // Exponential smoothing for natural bass pulsing
      smoothedBass += (targetBass - smoothedBass) * 0.18;

      var normalizedBass = smoothedBass / 255;
      var pulseScale = 1.0 + normalizedBass * 0.15; // Controlled badge scale

      ggBadge.style.transform = "scale(" + pulseScale.toFixed(3) + ")";

      if (smoothedBass > 140) {
        ggBadge.style.borderColor = '#00f0ff';
        ggBadge.style.boxShadow = "0 0 25px rgba(0, 240, 255, 0.6), 0 0 40px rgba(255, 0, 68, 0.5)";
      } else {
        ggBadge.style.borderColor = (smoothedBass > 85) ? '#ff0044' : '#9d00ff';
        ggBadge.style.boxShadow = "0 0 " + Math.floor(normalizedBass * 20 + 8) + "px rgba(255, 0, 68, 0.6)";
      }

      var frameGlow = Math.floor(normalizedBass * 22) + 10;
      frameBox.style.boxShadow = "0 0 " + frameGlow + "px rgba(255, 0, 68, 0.35)";

      var spacing = 8;
      var totalSpacing = spacing * (NUM_BARS + 1);
      var barWidth = (canvas.width - totalSpacing) / NUM_BARS;
      var maxBarHeight = canvas.height - 45;

      for (var i = 0; i < NUM_BARS; i++) {
        var targetHeight = 6;

        if (isPlaying) {
          // Coordinated sine harmonic across the bar index + gentle organic flutter
          var harmonic = Math.sin(t * 8.5 + (i * 0.45));
          var subHarmonic = Math.cos(t * 4.2 - (i * 0.25));
          var barEnergy = Math.max(0, (harmonic * 0.6 + subHarmonic * 0.4 + rawKick * 0.5));
          var flutter = (Math.random() * 0.15);

          // Scaled with frequency roll-off curve
          var profileWeight = barWeights[i] || 0.4;
          targetHeight = 6 + (barEnergy + flutter) * maxBarHeight * profileWeight * 0.85;
          if (targetHeight > maxBarHeight) targetHeight = maxBarHeight;
        }

        // Smooth rise (lerp), controlled gravity decay
        if (targetHeight > currentHeights[i]) {
          currentHeights[i] += (targetHeight - currentHeights[i]) * 0.32;
        } else {
          currentHeights[i] -= 5.5;
          if (currentHeights[i] < 6) currentHeights[i] = 6;
        }

        // Floating peak caps with realistic gravity
        if (currentHeights[i] >= peaks[i]) {
          peaks[i] = currentHeights[i];
        } else {
          peaks[i] -= 2.2;
          if (peaks[i] < 6) peaks[i] = 6;
        }

        var x = spacing + i * (barWidth + spacing);
        var y = canvas.height - currentHeights[i] - 8;

        // Alternate neon red and electric purple
        ctx.fillStyle = (i % 2 === 0) ? '#ff0044' : '#9d00ff';
        ctx.fillRect(x, y, barWidth, currentHeights[i]);

        // Peak line
        if (peaks[i] > 10) {
          ctx.fillStyle = '#ffffff';
          var peakY = canvas.height - peaks[i] - 12;
          if (peakY < 6) peakY = 6;
          ctx.fillRect(x, peakY, barWidth, 3);
        }
      }

      if (audio.duration && !isNaN(audio.duration)) {
        var pct = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = pct + "%";
        timeDisplay.textContent = formatTime(audio.currentTime) + " / " + formatTime(audio.duration);
      }

      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);

    function startPlayback() {
      audio.play().then(function() {
        overlayEl.style.display = "none";
        statusEl.textContent = "SYNCHRONIZED BROADCAST ACTIVE";
      }).catch(function() {
        overlayEl.style.display = "flex";
        statusEl.textContent = "CLICK SCREEN TO UNMUTE";
      });
    }

    function handleUserUnlock() {
      startPlayback();
    }

    if (audioUrl) {
      titleEl.textContent = decodeURIComponent(songName);

      // Convert standard Dropbox URL format to direct raw CDN stream
      var streamUrl = audioUrl
        .replace("www.dropbox.com", "dl.dropboxusercontent.com")
        .replace("?dl=0", "")
        .replace("&dl=0", "");

      if (streamUrl.indexOf("dl.dropboxusercontent.com") !== -1 && streamUrl.indexOf("?") === -1) {
        streamUrl += "?raw=1";
      }

      audio.src = streamUrl;

      audio.addEventListener('loadedmetadata', function() {
        if (!seekDone && startTime > 0 && !isNaN(startTime)) {
          audio.currentTime = startTime;
          seekDone = true;
        }
        startPlayback();
      });

      audio.addEventListener('canplay', function() {
        if (!seekDone && startTime > 0 && !isNaN(startTime)) {
          audio.currentTime = startTime;
          seekDone = true;
        }
      });
    }
  </script>
</body>
</html>
