<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SL Synced Jukebox</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0c10;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      user-select: none;
      cursor: pointer;
    }
    .player-card {
      background: #151821;
      border: 3px solid #00e5ff;
      border-radius: 20px;
      padding: 40px;
      width: 90%;
      max-width: 750px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .station-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 20px;
      background: #0d2538;
      border: 1px solid #00e5ff;
      border-radius: 16px;
      color: #00e5ff;
      font-size: 1.2rem;
      font-weight: bold;
      letter-spacing: 2px;
      margin-bottom: 20px;
    }
    .pulse-dot { width: 12px; height: 12px; background: #00e5ff; border-radius: 50%; }
    #title {
      font-size: 2.6rem;
      font-weight: bold;
      color: #ffffff;
      line-height: 1.2;
      margin-bottom: 20px;
      word-break: break-word;
    }
    .eq-container {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 10px;
      height: 70px;
      width: 100%;
      margin: 20px 0;
    }
    .bar {
      width: 16px;
      height: 30px;
      background-color: #00e5ff;
      border-radius: 6px;
    }
    #status { font-size: 1.3rem; color: #798ba3; margin-top: 15px; }
    #unlockBanner {
      display: none;
      background: #ffaa00;
      color: #000000;
      font-weight: bold;
      font-size: 1.4rem;
      padding: 12px 24px;
      border-radius: 12px;
      margin-top: 15px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
  </style>
</head>
<body onclick="userUnmute()">
  <div class="player-card">
    <div class="station-badge">
      <div class="pulse-dot"></div>
      <span>ON AIR</span>
    </div>
    <div id="title">Loading Stream...</div>
    <div class="eq-container">
      <div class="bar" id="b1"></div>
      <div class="bar" id="b2"></div>
      <div class="bar" id="b3"></div>
      <div class="bar" id="b4"></div>
      <div class="bar" id="b5"></div>
      <div class="bar" id="b6"></div>
      <div class="bar" id="b7"></div>
      <div class="bar" id="b8"></div>
    </div>
    <div id="status">Syncing universal playback...</div>
    <div id="unlockBanner">▶ Click Screen to Enable Sound</div>
  </div>

  <audio id="player" preload="auto"></audio>

  <script>
    const params = new URLSearchParams(window.location.search);
    const audioUrl = params.get('url');
    const songName = params.get('name') || "Now Playing";
    const startTime = parseFloat(params.get('t') || "0");

    const audio = document.getElementById('player');
    const titleEl = document.getElementById('title');
    const statusEl = document.getElementById('status');
    const unlockEl = document.getElementById('unlockBanner');
    const bars = [
      document.getElementById('b1'), document.getElementById('b2'),
      document.getElementById('b3'), document.getElementById('b4'),
      document.getElementById('b5'), document.getElementById('b6'),
      document.getElementById('b7'), document.getElementById('b8')
    ];

    setInterval(() => {
      bars.forEach(bar => {
        const h = Math.floor(Math.random() * 55) + 12;
        bar.style.height = h + 'px';
      });
    }, 110);

    function userUnmute() {
      if (audio.paused && audioUrl) {
        audio.play().then(() => {
          unlockEl.style.display = "none";
          statusEl.textContent = "Broadcasting Synced Audio";
        });
      }
    }

    if (audioUrl) {
      titleEl.textContent = decodeURIComponent(songName);
      audio.src = audioUrl;

      audio.addEventListener('loadedmetadata', () => {
        if (startTime > 0 && !isNaN(startTime)) {
          audio.currentTime = startTime;
        }
        audio.play().then(() => {
          statusEl.textContent = "Broadcasting Synced Audio";
          unlockEl.style.display = "none";
        }).catch(() => {
          statusEl.textContent = "Viewer browser blocked sound autoplay";
          unlockEl.style.display = "block";
        });
      }, { once: true });
    }
  </script>
</body>
</html>
