<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SL Synced DJ Deck</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #050608;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      padding: 14px;
      overflow: hidden;
      user-select: none;
      cursor: pointer;
    }

    /* Main Frame */
    .deck-frame {
      width: 100%;
      height: 100%;
      border: 4px solid #ff0044;
      border-radius: 22px;
      background-color: #0b0c12;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 16px 22px;
      position: relative;
      box-shadow: 0 0 25px rgba(255, 0, 68, 0.3);
      transition: box-shadow 0.08s ease, border-color 0.08s ease;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 0 4px;
    }

    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 16px;
      background-color: #ff0044;
      border-radius: 20px;
      box-shadow: 0 0 15px rgba(255, 0, 68, 0.6);
    }

    .pulse-dot {
      width: 10px;
      height: 10px;
      background-color: #ffffff;
      border-radius: 50%;
    }

    .station-text {
      color: #ffffff;
      font-size: 1rem;
      letter-spacing: 2px;
      font-weight: bold;
    }

    .sync-counter {
      font-size: 1.05rem;
      color: #b537f2;
      font-weight: bold;
      letter-spacing: 1px;
    }

    /* Mid Row: Title on Left, Big GG Emblem on Right */
    .mid-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      gap: 15px;
      margin: 4px 0;
    }

    #title {
      font-size: 2.1rem;
      font-weight: 900;
      color: #ffffff;
      line-height: 1.15;
      text-transform: uppercase;
      word-break: break-word;
      text-shadow: 0 0 16px rgba(181, 55, 242, 0.7);
      flex: 1;
    }

    /* Big Glowing GG Badge */
    .gg-emblem-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 68px;
      height: 68px;
      min-width: 68px;
      border-radius: 50%;
      border: 3px solid #ff0044;
      background: radial-gradient(circle, #25092b 0%, #0c0814 100%);
      box-shadow: 0 0 20px rgba(255, 0, 68, 0.6), inset 0 0 12px rgba(157, 0, 255, 0.5);
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }

    .gg-emblem-text {
      font-family: 'Arial Black', Impact, sans-serif;
      font-size: 1.9rem;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 1px;
      text-shadow: 0 0 10px #ff0044, 0 0 20px #9d00ff;
    }

    /* Extra Tall Visualizer Stage */
    #visualStage {
      width: 100%;
      height: 250px;
      background-color: #050608;
      border: 2px solid #23192d;
      border-radius: 12px;
      display: block;
    }

    /* Timeline Progress */
    .progress-wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 7px;
      background-color: #181422;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(to right, #ff0044, #9d00ff);
      border-radius: 4px;
      transition: width 0.3s linear;
    }

    .bottom-info {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 0.95rem;
      font-weight: bold;
      color: #79718a;
    }

    /* Visitor Modal */
    #clickOverlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(5, 6, 8, 0.94);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 20px;
      z-index: 100;
    }

    .click-btn {
      background: linear-gradient(135deg, #ff0044, #9d00ff);
      color: #ffffff;
      font-size: 1.9rem;
      padding: 18px 38px;
      border-radius: 18px;
      border: 3px solid #ffffff;
      text-transform: uppercase;
      font-weight: 900;
      letter-spacing: 2px;
      box-shadow: 0 0 35px rgba(255, 0, 68, 0.8);
    }
  </style>
</head>
<body onclick="handleUserUnlock()">

  <div class="deck-frame" id="frameBox">
    <!-- Overlay for Muted Visitors -->
    <div id="clickOverlay" style="display: none;">
      <div class="click-btn">🔊 CLICK TO TUNE IN</div>
    </div>

    <!-- Header -->
    <div class="top-bar">
      <div class="badge-pill">
        <div class="pulse-dot"></div>
        <span class="station-text">LIVE STREAM</span>
      </div>
      <div class="sync-counter" id="timeDisplay">0:00 / 0:00</div>
    </div>

    <!-- Mid Row: Title & Large Pulsing GG Emblem -->
    <div class="mid-header-row">
      <div id="title">JUKEBOX STANDBY</div>
      <div class="gg-emblem-wrap" id="ggBadge">
        <span class="gg-emblem-text">GG</span>
      </div>
    </div>

    <!-- Canvas Visualizer -->
    <canvas id="visualStage" width="800" height="340"></canvas>

    <!-- Progress Timeline -->
    <div class="progress-wrap">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
      <div class="bottom-info">
        <span id="status">SYNCHRONIZED DECK ACTIVE</span>
        <span>GG AUDIO ENGINE</span>
      </div>
    </div>
  </div>

  <audio id="player" preload="auto"></audio>

  <script>
    var params = new URLSearchParams(window.location.search);
    var audioUrl = params.get('url');
    var songName = params.get('name') || "Now Playing";
    var startTime = parseFloat(params.get('t') || "0");

    var audio = document.getElementById('player');
    var titleEl = document.getElementById('title');
    var statusEl = document.getElementById('status');
    var timeDisplay = document.getElementById('timeDisplay');
    var progressFill = document.getElementById('progressFill');
    var overlayEl = document.getElementById('clickOverlay');
    var frameBox = document.getElementById('frameBox');
    var ggBadge = document.getElementById('ggBadge');
    var canvas = document.getElementById('visualStage');
    var ctx = canvas.getContext('2d');

    // Visualizer variables
    var NUM_BARS = 22;
    var peaks = new Array(NUM_BARS).fill(0);
    var currentHeights = new Array(NUM_BARS).fill(12);

    // Web Audio Context
    var audioCtx = null;
    var analyser = null;
    var source = null;
    var freqData = null;
    var isAudioContextReady = false;

    function initAudioContext() {
      if (isAudioContextReady) return;
      try {
        var AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 64;
          analyser.smoothingTimeConstant = 0.85; // Extra smooth damping
          freqData = new Uint8Array(analyser.frequencyBinCount);

          audio.crossOrigin = "anonymous";
          source = audioCtx.createMediaElementSource(audio);
          source.connect(analyser);
          analyser.connect(audioCtx.destination);
          isAudioContextReady = true;
        }
      } catch (e) {
        isAudioContextReady = false;
      }
    }

    function formatTime(sec) {
      if (isNaN(sec) || sec < 0) return "0:00";
      var m = Math.floor(sec / 60);
      var s = Math.floor(sec % 60);
      return m + ":" + (s < 10 ? "0" : "") + s;
    }

    function render() {
      ctx.fillStyle = '#050608';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      var hasRealData = false;
      var bassLevel = 0;

      if (isAudioContextReady && analyser && !audio.paused) {
        analyser.getByteFrequencyData(freqData);
        var sum = 0;
        for (var k = 0; k < freqData.length; k++) { sum += freqData[k]; }
        if (sum > 0) {
          hasRealData = true;
          bassLevel = (freqData[0] + freqData[1] + freqData[2]) / 3;
        }
      } else if (!audio.paused) {
        bassLevel = Math.floor(Math.random() * 80) + 30;
      }

      // Dynamic Frame & GG Pulse Scaling
      var pulseScale = 1.0 + (bassLevel / 255) * 0.35;
      ggBadge.style.transform = "scale(" + pulseScale + ")";
      ggBadge.style.borderColor = (bassLevel > 130) ? '#ff0044' : '#9d00ff';
      ggBadge.style.boxShadow = "0 0 " + Math.floor((bassLevel / 255) * 30 + 15) + "px rgba(255, 0, 68, 0.7)";

      var frameGlow = Math.floor((bassLevel / 255) * 35) + 15;
      frameBox.style.boxShadow = "0 0 " + frameGlow + "px rgba(255, 0, 68, 0.4)";

      // Heavy Equalizer Parameters
      var spacing = 8;
      var totalSpacing = spacing * (NUM_BARS + 1);
      var barWidth = (canvas.width - totalSpacing) / NUM_BARS;
      // Headroom factor: max 72% height so bars stay grounded with heavy travel
      var maxHeadroom = (canvas.height - 30) * 0.72;

      for (var i = 0; i < NUM_BARS; i++) {
        var targetHeight = 10;

        if (hasRealData) {
          var dataIndex = Math.floor((i / NUM_BARS) * freqData.length);
          var normalized = (freqData[dataIndex] || 0) / 255;
          // Logarithmic power curve for heavy weighted feel
          targetHeight = Math.pow(normalized, 1.25) * maxHeadroom + 10;
        } else {
          if (!audio.paused && Math.random() > 0.35) {
            targetHeight = (Math.random() * maxHeadroom * 0.75) + 12;
          } else if (audio.paused) {
            targetHeight = 8;
          }
        }

        // Heavy inertia interpolation
        currentHeights[i] += (targetHeight - currentHeights[i]) * 0.35;

        // Peak Hold Caps with gravity drop
        if (currentHeights[i] > peaks[i]) {
          peaks[i] = currentHeights[i];
        } else {
          peaks[i] -= 2.2;
          if (peaks[i] < 0) peaks[i] = 0;
        }

        var x = spacing + i * (barWidth + spacing);
        var y = canvas.height - currentHeights[i] - 8;

        // Hot Neon Red & Vivid Purple Bars
        ctx.fillStyle = (i % 2 === 0) ? '#ff0044' : '#9d00ff';
        ctx.fillRect(x, y, barWidth, currentHeights[i]);

        // White Floating Cap
        ctx.fillStyle = '#ffffff';
        var peakY = canvas.height - peaks[i] - 13;
        ctx.fillRect(x, peakY, barWidth, 4);
      }

      // Update Progress
      if (audio.duration && !isNaN(audio.duration)) {
        var pct = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = pct + "%";
        timeDisplay.textContent = formatTime(audio.currentTime) + " / " + formatTime(audio.duration);
      }

      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);

    function startPlayback() {
      initAudioContext();
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      if (startTime > 0 && !isNaN(startTime)) {
        audio.currentTime = startTime;
      }

      audio.play().then(function() {
        overlayEl.style.display = "none";
        statusEl.textContent = "SYNCHRONIZED BROADCAST ACTIVE";
      }).catch(function() {
        overlayEl.style.display = "flex";
        statusEl.textContent = "CLICK SCREEN TO UNMUTE";
      });
    }

    function handleUserUnlock() {
      startPlayback();
    }

    if (audioUrl) {
      titleEl.textContent = decodeURIComponent(songName);
      audio.src = audioUrl;

      audio.addEventListener('loadedmetadata', function() {
        startPlayback();
      }, { once: true });
    }
  </script>
</body>
</html>
