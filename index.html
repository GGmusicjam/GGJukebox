<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SL Synced Jukebox</title>
  <style>
    body {
      background: #0f0f14;
      color: #e0e0e0;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
      user-select: none;
    }
    #title { font-size: 1.5rem; font-weight: bold; margin-bottom: 10px; color: #4fc3f7; }
    #status { font-size: 0.95rem; color: #888; }
    #syncInfo { font-size: 0.8rem; color: #555; margin-top: 15px; }
  </style>
</head>
<body>
  <div id="title">Loading Stream...</div>
  <div id="status">Syncing playback...</div>
  <div id="syncInfo"></div>
  <audio id="player" preload="auto"></audio>

  <script>
    const params = new URLSearchParams(window.location.search);
    const audioUrl = params.get('url');
    const songName = params.get('name') || "Now Playing";
    const startTime = parseFloat(params.get('t') || "0");

    const audio = document.getElementById('player');
    const titleEl = document.getElementById('title');
    const statusEl = document.getElementById('status');
    const syncInfoEl = document.getElementById('syncInfo');

    function stopPreviousAudio() {
      try {
        audio.pause();
        audio.removeAttribute('src');
        audio.load();
      } catch (e) {
        console.error("Cleanup error:", e);
      }
    }

    if (audioUrl) {
      stopPreviousAudio();
      
      titleEl.textContent = decodeURIComponent(songName);
      audio.src = audioUrl;

      const onMeta = function() {
        audio.removeEventListener('loadedmetadata', onMeta);
        
        if (startTime > 0 && !isNaN(startTime)) {
          audio.currentTime = startTime;
        }

        const playPromise = audio.play();
        if (playPromise !== undefined) {
          playPromise.then(() => {
            statusEl.textContent = "Playing (Synced)";
            syncInfoEl.textContent = "Offset: " + Math.round(startTime) + "s";
          }).catch(err => {
            statusEl.textContent = "Click screen to enable audio";
          });
        }
      };

      audio.addEventListener('loadedmetadata', onMeta);

      // Gracefully handle playback ending
      audio.addEventListener('ended', () => {
        statusEl.textContent = "Track finished. Awaiting next...";
      });

    } else {
      titleEl.textContent = "No Track Specified";
      statusEl.textContent = "Awaiting signal from SL...";
    }
  </script>
</body>
</html>
