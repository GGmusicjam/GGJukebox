<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GG Audio Engine — Live Stream</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #0d0d12;
      color: #ffffff;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    .deck-frame {
      width: 100%;
      height: 100%;
      padding: 18px 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: radial-gradient(circle at 50% 25%, #1a1626 0%, #0d0d12 75%);
      border: 3px solid #ff0055;
      box-shadow: inset 0 0 28px rgba(255, 0, 85, 0.35);
      position: relative;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 2;
    }

    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(90deg, #ff0055, #c80046);
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.4px;
      box-shadow: 0 0 14px rgba(255, 0, 85, 0.55);
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ffffff;
      animation: pulseDot 1.2s infinite ease-in-out;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.75); }
    }

    .right-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(20, 20, 30, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 5px 14px;
      border-radius: 999px;
    }

    .resync-btn {
      background: rgba(255, 0, 85, 0.2);
      border: 1px solid #ff0055;
      color: #ffffff;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.8px;
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(255, 0, 85, 0.35);
      transition: all 0.15s ease;
    }

    .resync-btn:hover {
      background: #ff0055;
      box-shadow: 0 0 14px rgba(255, 0, 85, 0.75);
    }

    .resync-btn.synced {
      border-color: #00f0ff;
      background: rgba(0, 240, 255, 0.22);
      color: #00f0ff;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.5);
    }

    .vol-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mute-btn {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 15px;
      cursor: pointer;
      padding: 0 2px;
    }

    input[type="range"].vol-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 90px;
      height: 5px;
      background: #2b2b3d;
      border-radius: 999px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"].vol-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #00f0ff;
      box-shadow: 0 0 10px #00f0ff;
      cursor: pointer;
    }

    .vol-label {
      font-size: 12px;
      font-weight: 700;
      color: #00f0ff;
      min-width: 36px;
      text-align: right;
    }

    .time-readout {
      font-size: 12px;
      font-weight: 700;
      color: #b784ff;
      letter-spacing: 0.6px;
      min-width: 78px;
      text-align: right;
    }

    /* Center Header: Track Title + GG Emblem */
    .track-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 4px 6px;
    }

    .track-title {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 0 14px rgba(183, 132, 255, 0.55);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 82%;
    }

    .gg-badge {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 3px solid #00f0ff;
      background: radial-gradient(circle, #2a123d 0%, #12101c 80%);
      box-shadow: 0 0 18px rgba(0, 240, 255, 0.65), inset 0 0 12px rgba(255, 0, 85, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #ffffff;
      text-shadow: 0 0 8px #ff0055;
      flex-shrink: 0;
      transition: transform 0.08s ease-out;
    }

    /* Equalizer Visualizer */
    .viz-stage {
      width: 100%;
      height: 44%;
      min-height: 110px;
      background: rgba(12, 12, 18, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 12px 14px 8px 14px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 6px;
    }

    .eq-col {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      position: relative;
    }

    .eq-cap {
      width: 100%;
      height: 3px;
      background: #ffffff;
      border-radius: 2px;
      margin-bottom: 3px;
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
      transition: transform 0.06s linear;
    }

    .eq-bar {
      width: 100%;
      height: 8%;
      border-radius: 3px 3px 0 0;
      transition: height 0.055s ease-out;
    }

    .eq-bar.pink {
      background: linear-gradient(180deg, #ff1e6e 0%, #b80044 100%);
      box-shadow: 0 0 10px rgba(255, 30, 110, 0.45);
    }

    .eq-bar.purple {
      background: linear-gradient(180deg, #b829ff 0%, #6800b8 100%);
      box-shadow: 0 0 10px rgba(184, 41, 255, 0.45);
    }

    /* Bottom Progress & Footer */
    .bottom-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #ff0055, #b829ff, #00f0ff);
      box-shadow: 0 0 10px rgba(184, 41, 255, 0.7);
      transition: width 0.25s linear;
    }

    .footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.4px;
      color: rgba(255, 255, 255, 0.55);
    }

    .tap-overlay {
      position: absolute;
      inset: 0;
      background: rgba(10, 10, 16, 0.86);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10;
      cursor: pointer;
    }

    .tap-btn {
      background: linear-gradient(90deg, #ff0055, #b829ff);
      border: 2px solid #ffffff;
      color: #ffffff;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 1.5px;
      padding: 12px 26px;
      border-radius: 999px;
      box-shadow: 0 0 24px rgba(255, 0, 85, 0.8);
    }
  </style>
</head>
<body>
  <div class="deck-frame">
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="live-pill">
        <span class="live-dot"></span>
        <span>LIVE STREAM</span>
      </div>

      <div class="right-controls" id="hudControls">
        <button id="resyncBtn" class="resync-btn" title="Resync Audio Stream">&#x21BB; RESYNC</button>

        <div class="vol-group">
          <button id="muteBtn" class="mute-btn" title="Mute / Unmute">&#x1F50A;</button>
          <input id="volSlider" class="vol-slider" type="range" min="0" max="100" value="100" />
          <span id="volLabel" class="vol-label">100%</span>
        </div>

        <span id="timeReadout" class="time-readout">0:00 / 0:00</span>
      </div>
    </div>

    <!-- Track Title & GG Emblem -->
    <div class="track-header">
      <div id="trackTitle" class="track-title">LOADING STREAM...</div>
      <div id="ggBadge" class="gg-badge">GG</div>
    </div>

    <!-- 22-Bar Equalizer Stage -->
    <div id="vizStage" class="viz-stage"></div>

    <!-- Bottom Progress & Engine Status -->
    <div class="bottom-section">
      <div class="progress-track">
        <div id="progressFill" class="progress-fill"></div>
      </div>
      <div class="footer-row">
        <span id="modeStatus">SYNCHRONIZED BROADCAST ACTIVE</span>
        <span>GG AUDIO ENGINE</span>
      </div>
    </div>

    <!-- Autoplay Fallback Overlay -->
    <div id="tapOverlay" class="tap-overlay">
      <div class="tap-btn">&#9654; CLICK TO UNMUTE AUDIO</div>
    </div>
  </div>

  <audio id="audioPlayer" crossorigin="anonymous" preload="auto"></audio>

  <script>
    const params      = new URLSearchParams(window.location.search);
    const streamUrl   = params.get('url') || '';
    const trackName   = params.get('name') || 'GG LIVE STREAM';
    const startOffset = parseFloat(params.get('t') || '0');
    const syncStamp   = parseFloat(params.get('sync') || '0');
    const initVol     = Math.min(100, Math.max(0, parseInt(params.get('vol') || '100', 10)));
    const isWallMuted = params.get('mute') === '1';

    const audio        = document.getElementById('audioPlayer');
    const trackTitleEl = document.getElementById('trackTitle');
    const timeReadout  = document.getElementById('timeReadout');
    const progressFill = document.getElementById('progressFill');
    const volSlider    = document.getElementById('volSlider');
    const volLabel     = document.getElementById('volLabel');
    const muteBtn      = document.getElementById('muteBtn');
    const resyncBtn    = document.getElementById('resyncBtn');
    const hudControls  = document.getElementById('hudControls');
    const modeStatus   = document.getElementById('modeStatus');
    const vizStage     = document.getElementById('vizStage');
    const ggBadge      = document.getElementById('ggBadge');
    const tapOverlay   = document.getElementById('tapOverlay');

    trackTitleEl.textContent = trackName;

    // Build 22 alternating pink/purple equalizer bars with white peak caps
    const BAR_COUNT = 22;
    const bars = [];
    const caps = [];
    const barHeights = new Array(BAR_COUNT).fill(8);
    const capHeights = new Array(BAR_COUNT).fill(10);

    for (let i = 0; i < BAR_COUNT; i++) {
      const col = document.createElement('div');
      col.className = 'eq-col';

      const cap = document.createElement('div');
      cap.className = 'eq-cap';

      const bar = document.createElement('div');
      bar.className = 'eq-bar ' + (i % 2 === 0 ? 'pink' : 'purple');

      col.appendChild(cap);
      col.appendChild(bar);
      vizStage.appendChild(col);

      bars.push(bar);
      caps.push(cap);
    }

    function formatTime(sec) {
      if (!isFinite(sec) || sec < 0) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return m + ':' + (s < 10 ? '0' : '') + s;
    }

    function computeLiveOffset() {
      if (syncStamp > 0) {
        const nowSec = Math.floor(Date.now() / 1000);
        return startOffset + Math.max(0, nowSec - syncStamp);
      }
      return startOffset;
    }

    function seekToLive() {
      const target = computeLiveOffset();
      if (isFinite(audio.duration) && audio.duration > 0) {
        if (target < audio.duration) {
          audio.currentTime = target;
        }
      } else if (target > 0) {
        audio.currentTime = target;
      }
    }

    // Physical wall screen mode (&mute=1): silent visual display only
    if (isWallMuted) {
      audio.muted = true;
      audio.volume = 0;
      hudControls.style.display = 'none';
      modeStatus.textContent = 'VISUAL DISPLAY MODE (HUD AUDIO)';
    } else {
      audio.muted = false;
      audio.volume = initVol / 100;
      volSlider.value = initVol;
      volLabel.textContent = initVol + '%';
    }

    // Volume slider & mute toggle
    volSlider.addEventListener('input', () => {
      if (isWallMuted) return;
      const val = parseInt(volSlider.value, 10);
      audio.muted = (val === 0);
      audio.volume = val / 100;
      volLabel.textContent = val + '%';
      muteBtn.innerHTML = val === 0 ? '&#x1F507;' : '&#x1F50A;';
    });

    muteBtn.addEventListener('click', () => {
      if (isWallMuted) return;
      audio.muted = !audio.muted;
      if (audio.muted) {
        volLabel.textContent = '0%';
        muteBtn.innerHTML = '&#x1F507;';
      } else {
        const val = parseInt(volSlider.value, 10) || 100;
        audio.volume = val / 100;
        volLabel.textContent = val + '%';
        muteBtn.innerHTML = '&#x1F50A;';
      }
    });

    // Resync button next to volume slider
    resyncBtn.addEventListener('click', () => {
      seekToLive();
      audio.play().catch(() => {});
      resyncBtn.textContent = '✓ SYNCED';
      resyncBtn.classList.add('synced');
      setTimeout(() => {
        resyncBtn.innerHTML = '&#x21BB; RESYNC';
        resyncBtn.classList.remove('synced');
      }, 1500);
    });

    // Web Audio API Analyzer (with graceful synthetic fallback for CORS streams)
    let audioCtx = null;
    let analyser = null;
    let freqData = null;
    let analyserReady = false;

    function initAudioAnalyser() {
      if (analyserReady) return;
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
        const src = audioCtx.createMediaElementSource(audio);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 128;
        analyser.smoothingTimeConstant = 0.72;
        src.connect(analyser);
        analyser.connect(audioCtx.destination);
        freqData = new Uint8Array(analyser.frequencyBinCount);
        analyserReady = true;
      } catch (e) {
        analyserReady = false;
      }
    }

    function renderVisualizer() {
      requestAnimationFrame(renderVisualizer);

      let hasLiveSignal = false;
      if (analyserReady && analyser && !audio.paused) {
        analyser.getByteFrequencyData(freqData);
        for (let k = 0; k < 24; k++) {
          if (freqData[k] > 5) {
            hasLiveSignal = true;
            break;
          }
        }
      }

      const now = performance.now() * 0.005;
      let bassEnergy = 0;

      for (let i = 0; i < BAR_COUNT; i++) {
        let targetPct = 8;

        if (hasLiveSignal) {
          // Skip sub-bass rumble bins 0-3 and map bars across punchy EDM mids/highs
          const binIndex = Math.min(freqData.length - 1, i + 4);
          let norm = freqData[binIndex] / 255;
          // Desensitize low bars slightly & apply 0.48 noise gate for sharp drum-beat jumps
          if (i < 3) norm *= 0.78;
          if (norm < 0.48) {
            targetPct = 8 + norm * 18;
          } else {
            targetPct = Math.min(98, 22 + Math.pow((norm - 0.48) / 0.52, 0.85) * 76);
          }
        } else if (!audio.paused || isWallMuted) {
          // Smooth beat-reactive fallback when stream CORS headers block raw FFT data
          const wave = Math.sin(now * 2.4 + i * 0.55) * 0.5 + 0.5;
          const beat = Math.pow(Math.sin(now * 4.2) * 0.5 + 0.5, 3);
          const taper = 1 - (i / BAR_COUNT) * 0.35;
          targetPct = Math.min(92, 14 + (wave * 42 + beat * 38) * taper);
        }

        // Fast attack, controlled fall rate
        if (targetPct > barHeights[i]) {
          barHeights[i] += (targetPct - barHeights[i]) * 0.55;
        } else {
          barHeights[i] += (targetPct - barHeights[i]) * 0.22;
        }

        if (barHeights[i] > capHeights[i]) {
          capHeights[i] = barHeights[i];
        } else {
          capHeights[i] = Math.max(barHeights[i], capHeights[i] - 0.9);
        }

        bars[i].style.height = barHeights[i].toFixed(1) + '%';
        if (i < 5) bassEnergy += barHeights[i];
      }

      const avgBass = bassEnergy / 5;
      const scale = 1 + Math.max(0, (avgBass - 45) / 350);
      ggBadge.style.transform = 'scale(' + scale.toFixed(3) + ')';
    }

    // Track progress & timer readout
    audio.addEventListener('timeupdate', () => {
      const cur = audio.currentTime || 0;
      const dur = audio.duration || 0;
      timeReadout.textContent = formatTime(cur) + ' / ' + formatTime(dur);
      if (isFinite(dur) && dur > 0) {
        progressFill.style.width = Math.min(100, (cur / dur) * 100).toFixed(2) + '%';
      }
    });

    // Load & start stream
    if (streamUrl) {
      audio.src = streamUrl;
      audio.addEventListener('loadedmetadata', () => {
        seekToLive();
      }, { once: true });

      const playPromise = audio.play();
      if (playPromise !== undefined) {
        playPromise.then(() => {
          if (!isWallMuted) initAudioAnalyser();
        }).catch(() => {
          if (!isWallMuted) {
            tapOverlay.style.display = 'flex';
          }
        });
      }
    }

    tapOverlay.addEventListener('click', () => {
      tapOverlay.style.display = 'none';
      initAudioAnalyser();
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      seekToLive();
      audio.play().catch(() => {});
    });

    renderVisualizer();
  </script>
</body>
</html>
