<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SL Synced Jukebox</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at center, #1a1b26 0%, #0c0d14 100%);
      color: #ffffff;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      user-select: none;
    }

    /* Glassmorphic player container */
    .player-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 40px;
      width: 88%;
      max-width: 750px;
      display: flex;
      flex-direction: column;
      align-items: center;
      backdrop-filter: blur(12px);
    }

    /* Live Station Tag */
    .station-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      background: rgba(0, 230, 255, 0.12);
      border: 1px solid rgba(0, 230, 255, 0.35);
      border-radius: 20px;
      color: #00e5ff;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background: #00e5ff;
      border-radius: 50%;
      box-shadow: 0 0 10px #00e5ff;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.7; }
      50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 15px #00e5ff; }
      100% { transform: scale(0.9); opacity: 0.7; }
    }

    /* Track Title (Big & High Visibility) */
    #title {
      font-size: 2.3rem;
      font-weight: 800;
      color: #ffffff;
      text-align: center;
      line-height: 1.25;
      margin-bottom: 18px;
      text-shadow: 0 4px 20px rgba(0, 229, 255, 0.3);
      max-width: 100%;
      word-break: break-word;
    }

    /* Equalizer Visualizer Bars */
    .eq-container {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 6px;
      height: 38px;
      margin: 16px 0;
    }

    .bar {
      width: 6px;
      background: linear-gradient(to top, #0077ff, #00e5ff);
      border-radius: 4px;
      height: 6px;
      transition: height 0.2s ease;
    }

    .playing .bar {
      animation: eqBounce 1.2s ease-in-out infinite alternate;
    }

    .playing .bar:nth-child(1) { animation-duration: 0.7s; }
    .playing .bar:nth-child(2) { animation-duration: 1.1s; }
    .playing .bar:nth-child(3) { animation-duration: 0.6s; }
    .playing .bar:nth-child(4) { animation-duration: 0.9s; }
    .playing .bar:nth-child(5) { animation-duration: 1.3s; }
    .playing .bar:nth-child(6) { animation-duration: 0.8s; }
    .playing .bar:nth-child(7) { animation-duration: 1.0s; }

    @keyframes eqBounce {
      0% { height: 6px; }
      100% { height: 36px; }
    }

    /* Status text */
    #status {
      font-size: 1.1rem;
      font-weight: 500;
      color: #8fa0b5;
      margin-top: 10px;
    }

    #syncInfo {
      font-size: 0.85rem;
      color: #556275;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <div class="player-card">
    <div class="station-badge">
      <div class="pulse-dot"></div>
      <span id="badgeText">ON AIR</span>
    </div>

    <div id="title">Loading Stream...</div>

    <div class="eq-container" id="eq">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>

    <div id="status">Syncing universal playback...</div>
    <div id="syncInfo"></div>
  </div>

  <audio id="player" preload="auto"></audio>

  <script>
    const params = new URLSearchParams(window.location.search);
    const audioUrl = params.get('url');
    const songName = params.get('name') || "Now Playing";
    const startTime = parseFloat(params.get('t') || "0");

    const audio = document.getElementById('player');
    const titleEl = document.getElementById('title');
    const statusEl = document.getElementById('status');
    const syncInfoEl = document.getElementById('syncInfo');
    const eqEl = document.getElementById('eq');

    function stopPreviousAudio() {
      try {
        audio.pause();
        audio.removeAttribute('src');
        audio.load();
        eqEl.classList.remove('playing');
      } catch (e) {}
    }

    if (audioUrl) {
      stopPreviousAudio();
      
      titleEl.textContent = decodeURIComponent(songName);
      audio.src = audioUrl;

      const onMeta = function() {
        audio.removeEventListener('loadedmetadata', onMeta);
        
        if (startTime > 0 && !isNaN(startTime)) {
          audio.currentTime = startTime;
        }

        const playPromise = audio.play();
        if (playPromise !== undefined) {
          playPromise.then(() => {
            statusEl.textContent = "Broadcasting Synced Audio";
            syncInfoEl.textContent = "Offset: " + Math.round(startTime) + "s";
            eqEl.classList.add('playing');
          }).catch(err => {
            statusEl.textContent = "Click screen to enable audio";
          });
        }
      };

      audio.addEventListener('loadedmetadata', onMeta);

      audio.addEventListener('ended', () => {
        statusEl.textContent = "Track finished. Awaiting next...";
        eqEl.classList.remove('playing');
      });

    } else {
      titleEl.textContent = "Jukebox Standby";
      statusEl.textContent = "Awaiting signal from SL...";
    }
  </script>
</body>
</html>
