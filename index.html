<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SL Synced DJ Deck</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #050608;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      padding: 14px;
      overflow: hidden;
      user-select: none;
      cursor: pointer;
    }

    /* Main Deck Frame with Red/Purple Reactive Glow */
    .deck-frame {
      width: 100%;
      height: 100%;
      border: 4px solid #ff0044;
      border-radius: 20px;
      background-color: #0b0c12;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      position: relative;
      box-shadow: 0 0 25px rgba(255, 0, 68, 0.3);
      transition: box-shadow 0.08s ease, border-color 0.08s ease;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 0 6px;
    }

    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 16px;
      background-color: #ff0044;
      border-radius: 20px;
      box-shadow: 0 0 15px rgba(255, 0, 68, 0.6);
    }

    .pulse-dot {
      width: 10px;
      height: 10px;
      background-color: #ffffff;
      border-radius: 50%;
    }

    .station-text {
      color: #ffffff;
      font-size: 1rem;
      letter-spacing: 2px;
      font-weight: bold;
    }

    .sync-counter {
      font-size: 1rem;
      color: #b537f2;
      font-weight: bold;
      letter-spacing: 1px;
    }

    /* Song Title */
    #title {
      font-size: 2.2rem;
      font-weight: 900;
      color: #ffffff;
      text-align: center;
      line-height: 1.1;
      text-transform: uppercase;
      word-break: break-word;
      max-width: 95%;
      margin: 4px 0;
      text-shadow: 0 0 15px rgba(181, 55, 242, 0.7);
    }

    /* Extra Tall Visualizer Stage (3x Vertical Room) */
    #visualStage {
      width: 100%;
      height: 250px;
      background-color: #050608;
      border: 2px solid #23192d;
      border-radius: 12px;
      display: block;
    }

    /* Timeline Progress */
    .progress-wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 7px;
      background-color: #181422;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(to right, #ff0044, #9d00ff);
      border-radius: 4px;
      transition: width 0.3s linear;
    }

    .bottom-info {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 0.95rem;
      font-weight: bold;
      color: #79718a;
    }

    /* Visitor Modal */
    #clickOverlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(5, 6, 8, 0.94);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      z-index: 100;
    }

    .click-btn {
      background: linear-gradient(135deg, #ff0044, #9d00ff);
      color: #ffffff;
      font-size: 1.9rem;
      padding: 18px 38px;
      border-radius: 18px;
      border: 3px solid #ffffff;
      text-transform: uppercase;
      font-weight: 900;
      letter-spacing: 2px;
      box-shadow: 0 0 35px rgba(255, 0, 68, 0.8);
      animation: pulseBtn 1.5s infinite ease-in-out;
    }

    @keyframes pulseBtn {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
  </style>
</head>
<body onclick="handleUserUnlock()">

  <div class="deck-frame" id="frameBox">
    <!-- Modal for Muted Guests -->
    <div id="clickOverlay" style="display: none;">
      <div class="click-btn">🔊 CLICK TO TUNE IN</div>
    </div>

    <!-- Header -->
    <div class="top-bar">
      <div class="badge-pill">
        <div class="pulse-dot"></div>
        <span class="station-text">LIVE STREAM</span>
      </div>
      <div class="sync-counter" id="timeDisplay">0:00 / 0:00</div>
    </div>

    <!-- Song Title -->
    <div id="title">JUKEBOX STANDBY</div>

    <!-- High-Clearance Canvas Visualizer -->
    <canvas id="visualStage" width="800" height="340"></canvas>

    <!-- Progress Timeline -->
    <div class="progress-wrap">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
      <div class="bottom-info">
        <span id="status">SYNCHRONIZED DECK ACTIVE</span>
        <span>GG AUDIO ENGINE</span>
      </div>
    </div>
  </div>

  <audio id="player" preload="auto"></audio>

  <script>
    var params = new URLSearchParams(window.location.search);
    var audioUrl = params.get('url');
    var songName = params.get('name') || "Now Playing";
    var startTime = parseFloat(params.get('t') || "0");

    var audio = document.getElementById('player');
    var titleEl = document.getElementById('title');
    var statusEl = document.getElementById('status');
    var timeDisplay = document.getElementById('timeDisplay');
    var progressFill = document.getElementById('progressFill');
    var overlayEl = document.getElementById('clickOverlay');
    var frameBox = document.getElementById('frameBox');
    var canvas = document.getElementById('visualStage');
    var ctx = canvas.getContext('2d');

    // Visualizer variables
    var NUM_BARS = 22;
    var peaks = new Array(NUM_BARS).fill(0);
    var syntheticHeights = new Array(NUM_BARS).fill(15);

    // Audio Context Setup
    var audioCtx = null;
    var analyser = null;
    var source = null;
    var freqData = null;
    var isAudioContextReady = false;

    function initAudioContext() {
      if (isAudioContextReady) return;
      try {
        var AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 64;
          analyser.smoothingTimeConstant = 0.75;
          freqData = new Uint8Array(analyser.frequencyBinCount);

          audio.crossOrigin = "anonymous";
          source = audioCtx.createMediaElementSource(audio);
          source.connect(analyser);
          analyser.connect(audioCtx.destination);
          isAudioContextReady = true;
        }
      } catch (e) {
        isAudioContextReady = false;
      }
    }

    function formatTime(sec) {
      if (isNaN(sec) || sec < 0) return "0:00";
      var m = Math.floor(sec / 60);
      var s = Math.floor(sec % 60);
      return m + ":" + (s < 10 ? "0" : "") + s;
    }

    function render() {
      ctx.fillStyle = '#050608';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      var hasRealData = false;
      var bassLevel = 0;

      if (isAudioContextReady && analyser && !audio.paused) {
        analyser.getByteFrequencyData(freqData);
        var sum = 0;
        for (var k = 0; k < freqData.length; k++) { sum += freqData[k]; }
        if (sum > 0) {
          hasRealData = true;
          bassLevel = (freqData[0] + freqData[1] + freqData[2]) / 3;
        }
      } else if (!audio.paused) {
        // Fallback bass simulation
        bassLevel = Math.floor(Math.random() * 120) + 40;
      }

      // Dynamic Frame Border Glow based on Bass
      var glowIntensity = Math.floor((bassLevel / 255) * 50) + 15;
      frameBox.style.boxShadow = "0 0 " + glowIntensity + "px rgba(255, 0, 68, 0.5)";

      // ==========================================
      // DRAW DEDICATED PULSING "GG" EMBLEM (Top-Right)
      // ==========================================
      var ggScale = 1.0 + (bassLevel / 255) * 0.28;
      var ggX = canvas.width - 65;
      var ggY = 48;

      ctx.save();
      ctx.translate(ggX, ggY);
      ctx.scale(ggScale, ggScale);

      // Outer glowing ring
      ctx.strokeStyle = (bassLevel > 130) ? '#ff0044' : '#9d00ff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, 0, 24, 0, Math.PI * 2);
      ctx.stroke();

      // Inner GG text
      ctx.fillStyle = '#ffffff';
      ctx.font = '900 20px "Arial Black", Impact, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText("GG", 0, 1);
      ctx.restore();

      // ==========================================
      // RENDER TALL EQUALIZER BARS (Red & Purple)
      // ==========================================
      var spacing = 8;
      var totalSpacing = spacing * (NUM_BARS + 1);
      var barWidth = (canvas.width - totalSpacing) / NUM_BARS;
      var maxBarHeight = canvas.height - 40; // Full 3x vertical sweep range

      for (var i = 0; i < NUM_BARS; i++) {
        var barHeight = 12;

        if (hasRealData) {
          var dataIndex = Math.floor((i / NUM_BARS) * freqData.length);
          var val = freqData[dataIndex] || 0;
          barHeight = (val / 255) * maxBarHeight + 10;
        } else {
          if (!audio.paused && Math.random() > 0.2) {
            syntheticHeights[i] = Math.floor(Math.random() * maxBarHeight) + 15;
          } else if (audio.paused) {
            syntheticHeights[i] = 10;
          }
          barHeight = syntheticHeights[i];
        }

        // Floating Peak Hold Caps
        if (barHeight > peaks[i]) {
          peaks[i] = barHeight;
        } else {
          peaks[i] -= 3.0; // Gravity drop
          if (peaks[i] < 0) peaks[i] = 0;
        }

        var x = spacing + i * (barWidth + spacing);
        var y = canvas.height - barHeight - 8;

        // Alternate Hot Neon Red (#ff0044) & Vivid Purple (#9d00ff)
        ctx.fillStyle = (i % 2 === 0) ? '#ff0044' : '#9d00ff';
        ctx.fillRect(x, y, barWidth, barHeight);

        // White Peak Cap
        ctx.fillStyle = '#ffffff';
        var peakY = canvas.height - peaks[i] - 13;
        if (peakY < 6) peakY = 6;
        ctx.fillRect(x, peakY, barWidth, 4);
      }

      // Update Progress Timeline
      if (audio.duration && !isNaN(audio.duration)) {
        var pct = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = pct + "%";
        timeDisplay.textContent = formatTime(audio.currentTime) + " / " + formatTime(audio.duration);
      }

      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);

    function startPlayback() {
      initAudioContext();
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      if (startTime > 0 && !isNaN(startTime)) {
        audio.currentTime = startTime;
      }

      audio.play().then(function() {
        overlayEl.style.display = "none";
        statusEl.textContent = "SYNCHRONIZED BROADCAST ACTIVE";
      }).catch(function() {
        overlayEl.style.display = "flex";
        statusEl.textContent = "CLICK SCREEN TO UNMUTE";
      });
    }

    function handleUserUnlock() {
      startPlayback();
    }

    if (audioUrl) {
      titleEl.textContent = decodeURIComponent(songName);
      audio.src = audioUrl;

      audio.addEventListener('loadedmetadata', function() {
        startPlayback();
      }, { once: true });
    }
  </script>
</body>
</html>
