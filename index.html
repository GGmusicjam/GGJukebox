<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SL Synced DJ Deck</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #040508;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      padding: 14px;
      overflow: hidden;
      user-select: none;
      cursor: pointer;
    }

    /* Main Frame */
    .deck-frame {
      width: 100%;
      height: 100%;
      border: 4px solid #ff0044;
      border-radius: 22px;
      background-color: #0a0b12;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 16px 22px;
      position: relative;
      box-shadow: 0 0 25px rgba(255, 0, 68, 0.35);
      transition: box-shadow 0.05s ease, border-color 0.05s ease;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 0 4px;
    }

    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 16px;
      background-color: #ff0044;
      border-radius: 20px;
      box-shadow: 0 0 15px rgba(255, 0, 68, 0.6);
    }

    .pulse-dot {
      width: 10px;
      height: 10px;
      background-color: #ffffff;
      border-radius: 50%;
    }

    .station-text {
      color: #ffffff;
      font-size: 1rem;
      letter-spacing: 2px;
      font-weight: bold;
    }

    .sync-counter {
      font-size: 1.05rem;
      color: #b537f2;
      font-weight: bold;
      letter-spacing: 1px;
    }

    /* Header Row (Title + Stylized GG Emblem shifted left) */
    .mid-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 0 12px;
      gap: 20px;
      margin: 4px 0;
    }

    #title {
      font-size: 2.1rem;
      font-weight: 900;
      color: #ffffff;
      line-height: 1.15;
      text-transform: uppercase;
      word-break: break-word;
      text-shadow: 0 0 16px rgba(181, 55, 242, 0.8);
      flex: 1;
    }

    /* Stylized Cyber GG Core */
    .gg-emblem-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 76px;
      height: 76px;
      min-width: 76px;
      margin-right: 15px; /* Shifts emblem noticeably leftward */
      border-radius: 50%;
      border: 3px solid #ff0044;
      background: radial-gradient(circle at 35% 35%, #3d0a47 0%, #0d0718 100%);
      box-shadow: 0 0 20px rgba(255, 0, 68, 0.7), inset 0 0 15px rgba(157, 0, 255, 0.6);
      position: relative;
      transform-origin: center center;
    }

    .gg-emblem-wrap::before {
      content: '';
      position: absolute;
      width: 86px;
      height: 86px;
      border-radius: 50%;
      border: 2px dashed #9d00ff;
      opacity: 0.8;
    }

    .gg-emblem-text {
      font-family: 'Arial Black', Impact, sans-serif;
      font-size: 2.1rem;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 2px;
      text-shadow: 0 0 10px #ff0044, 0 0 20px #9d00ff, 0 0 30px #00f0ff;
    }

    /* Tall Visualizer Stage */
    #visualStage {
      width: 100%;
      height: 250px;
      background-color: #040508;
      border: 2px solid #23192d;
      border-radius: 12px;
      display: block;
    }

    /* Timeline Progress */
    .progress-wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 7px;
      background-color: #181422;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(to right, #ff0044, #9d00ff);
      border-radius: 4px;
      transition: width 0.3s linear;
    }

    .bottom-info {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 0.95rem;
      font-weight: bold;
      color: #79718a;
    }

    /* Visitor Modal */
    #clickOverlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(4, 5, 8, 0.94);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 20px;
      z-index: 100;
    }

    .click-btn {
      background: linear-gradient(135deg, #ff0044, #9d00ff);
      color: #ffffff;
      font-size: 1.9rem;
      padding: 18px 38px;
      border-radius: 18px;
      border: 3px solid #ffffff;
      text-transform: uppercase;
      font-weight: 900;
      letter-spacing: 2px;
      box-shadow: 0 0 35px rgba(255, 0, 68, 0.8);
    }
  </style>
</head>
<body onclick="handleUserUnlock()">

  <div class="deck-frame" id="frameBox">
    <!-- Overlay for Muted Guests -->
    <div id="clickOverlay" style="display: none;">
      <div class="click-btn">🔊 CLICK TO TUNE IN</div>
    </div>

    <!-- Header -->
    <div class="top-bar">
      <div class="badge-pill">
        <div class="pulse-dot"></div>
        <span class="station-text">LIVE STREAM</span>
      </div>
      <div class="sync-counter" id="timeDisplay">0:00 / 0:00</div>
    </div>

    <!-- Mid Row: Title & Stylized Shifted GG -->
    <div class="mid-header-row">
      <div id="title">JUKEBOX STANDBY</div>
      <div class="gg-emblem-wrap" id="ggBadge">
        <span class="gg-emblem-text">GG</span>
      </div>
    </div>

    <!-- Extra Tall Bouncy Canvas Visualizer -->
    <canvas id="visualStage" width="800" height="340"></canvas>

    <!-- Progress Timeline -->
    <div class="progress-wrap">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
      <div class="bottom-info">
        <span id="status">SYNCHRONIZED DECK ACTIVE</span>
        <span>GG AUDIO ENGINE</span>
      </div>
    </div>
  </div>

  <audio id="player" preload="auto"></audio>

  <script>
    var params = new URLSearchParams(window.location.search);
    var audioUrl = params.get('url');
    var songName = params.get('name') || "Now Playing";
    var startTime = parseFloat(params.get('t') || "0");

    var audio = document.getElementById('player');
    var titleEl = document.getElementById('title');
    var statusEl = document.getElementById('status');
    var timeDisplay = document.getElementById('timeDisplay');
    var progressFill = document.getElementById('progressFill');
    var overlayEl = document.getElementById('clickOverlay');
    var frameBox = document.getElementById('frameBox');
    var ggBadge = document.getElementById('ggBadge');
    var canvas = document.getElementById('visualStage');
    var ctx = canvas.getContext('2d');

    // 22 Equalizer Bars
    var NUM_BARS = 22;
    var peaks = new Array(NUM_BARS).fill(0);
    var currentHeights = new Array(NUM_BARS).fill(8);

    // Audio Context Setup
    var audioCtx = null;
    var analyser = null;
    var source = null;
    var freqData = null;
    var isAudioContextReady = false;

    function initAudioContext() {
      if (isAudioContextReady) return;
      try {
        var AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 128; // Higher resolution frequency bins
          analyser.smoothingTimeConstant = 0.55; // Snappy transient tracking
          freqData = new Uint8Array(analyser.frequencyBinCount);

          audio.crossOrigin = "anonymous";
          source = audioCtx.createMediaElementSource(audio);
          source.connect(analyser);
          analyser.connect(audioCtx.destination);
          isAudioContextReady = true;
        }
      } catch (e) {
        isAudioContextReady = false;
      }
    }

    function formatTime(sec) {
      if (isNaN(sec) || sec < 0) return "0:00";
      var m = Math.floor(sec / 60);
      var s = Math.floor(sec % 60);
      return m + ":" + (s < 10 ? "0" : "") + s;
    }

    function render() {
      ctx.fillStyle = '#040508';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      var hasRealData = false;
      var bassLevel = 0;

      if (isAudioContextReady && analyser && !audio.paused) {
        analyser.getByteFrequencyData(freqData);
        var sum = 0;
        for (var k = 0; k < freqData.length; k++) { sum += freqData[k]; }
        if (sum > 0) {
          hasRealData = true;
          // Calculate true punchy sub-bass from bins 1 to 4 (ignores DC offset at bin 0)
          bassLevel = (freqData[1] + freqData[2] + freqData[3] + freqData[4]) / 4;
        }
      } else if (!audio.paused) {
        // High-energy simulated beat pulse if audio context is isolated
        bassLevel = Math.random() > 0.45 ? Math.floor(Math.random() * 190) + 65 : 40;
      }

      // ==========================================
      // INTENSE EDM GG PULSE & CHROMATIC BASS GLOW
      // ==========================================
      var normalizedBass = bassLevel / 255;
      // Exponential pop: stays subtle on quiet parts, blows up on kicks
      var pulseScale = 1.0 + Math.pow(normalizedBass, 1.8) * 0.55;

      ggBadge.style.transform = "scale(" + pulseScale + ")";
      if (bassLevel > 165) {
        ggBadge.style.borderColor = '#00f0ff';
        ggBadge.style.boxShadow = "0 0 35px #00f0ff, 0 0 65px #ff0044";
      } else {
        ggBadge.style.borderColor = (bassLevel > 110) ? '#ff0044' : '#9d00ff';
        ggBadge.style.boxShadow = "0 0 " + Math.floor(normalizedBass * 30 + 15) + "px rgba(255, 0, 68, 0.8)";
      }

      var frameGlow = Math.floor(normalizedBass * 45) + 15;
      frameBox.style.boxShadow = "0 0 " + frameGlow + "px rgba(255, 0, 68, 0.45)";

      // ==========================================
      // BOUNCY EQUALIZER WITH HIGH REACTION RANGE
      // ==========================================
      var spacing = 8;
      var totalSpacing = spacing * (NUM_BARS + 1);
      var barWidth = (canvas.width - totalSpacing) / NUM_BARS;
      var maxBarHeight = canvas.height - 35;

      for (var i = 0; i < NUM_BARS; i++) {
        var targetHeight = 8;

        if (hasRealData) {
          // Logarithmic bin mapping (skip bin 0 to prevent stuck sub-bass)
          var logIndex = Math.floor(Math.pow(i / (NUM_BARS - 1), 1.6) * (freqData.length - 3)) + 1;
          var rawVal = freqData[logIndex] || 0;

          // Band EQ weighting: prevents low-end sticking, boosts highs for snappy hi-hat response
          var bandMultiplier = 0.82 + (i / NUM_BARS) * 0.65;
          var normalizedVal = Math.min((rawVal / 255) * bandMultiplier, 1.0);
          
          targetHeight = Math.pow(normalizedVal, 1.4) * maxBarHeight + 8;
        } else {
          if (!audio.paused) {
            targetHeight = (Math.random() > 0.3) ? (Math.random() * maxBarHeight * 0.9) + 12 : 8;
          }
        }

        // Snappy Attack / Fast Gravity Release
        if (targetHeight > currentHeights[i]) {
          // Instant snap up on beat
          currentHeights[i] = targetHeight;
        } else {
          // Fast fluid drop down between beats
          currentHeights[i] -= 12.0;
          if (currentHeights[i] < 8) currentHeights[i] = 8;
        }

        // Floating White Peak Caps
        if (currentHeights[i] >= peaks[i]) {
          peaks[i] = currentHeights[i];
        } else {
          peaks[i] -= 3.5; // Smooth gravity drop
          if (peaks[i] < 8) peaks[i] = 8;
        }

        var x = spacing + i * (barWidth + spacing);
        var y = canvas.height - currentHeights[i] - 8;

        // Alternate Hot Neon Red (#ff0044) & Vivid Electric Purple (#9d00ff)
        ctx.fillStyle = (i % 2 === 0) ? '#ff0044' : '#9d00ff';
        ctx.fillRect(x, y, barWidth, currentHeights[i]);

        // White Peak Cap
        ctx.fillStyle = '#ffffff';
        var peakY = canvas.height - peaks[i] - 13;
        if (peakY < 6) peakY = 6;
        ctx.fillRect(x, peakY, barWidth, 4);
      }

      // Update Timeline & Counter
      if (audio.duration && !isNaN(audio.duration)) {
        var pct = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = pct + "%";
        timeDisplay.textContent = formatTime(audio.currentTime) + " / " + formatTime(audio.duration);
      }

      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);

    function startPlayback() {
      initAudioContext();
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      if (startTime > 0 && !isNaN(startTime)) {
        audio.currentTime = startTime;
      }

      audio.play().then(function() {
        overlayEl.style.display = "none";
        statusEl.textContent = "SYNCHRONIZED BROADCAST ACTIVE";
      }).catch(function() {
        overlayEl.style.display = "flex";
        statusEl.textContent = "CLICK SCREEN TO UNMUTE";
      });
    }

    function handleUserUnlock() {
      startPlayback();
    }

    if (audioUrl) {
      titleEl.textContent = decodeURIComponent(songName);
      audio.src = audioUrl;

      audio.addEventListener('loadedmetadata', function() {
        startPlayback();
      }, { once: true });
    }
  </script>
</body>
</html>
