<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SL Synced Jukebox</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0c10;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      user-select: none;
    }

    .player-card {
      background: #151821;
      border: 2px solid #232a3b;
      border-radius: 20px;
      padding: 30px;
      width: 90%;
      max-width: 700px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* Live Station Tag */
    .station-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 18px;
      background: #0d2538;
      border: 1px solid #00e5ff;
      border-radius: 16px;
      color: #00e5ff;
      font-size: 1rem;
      font-weight: bold;
      letter-spacing: 2px;
      margin-bottom: 20px;
    }

    .pulse-dot {
      width: 10px;
      height: 10px;
      background: #00e5ff;
      border-radius: 50%;
    }

    /* Song Title */
    #title {
      font-size: 2.2rem;
      font-weight: bold;
      color: #ffffff;
      line-height: 1.25;
      margin-bottom: 20px;
      word-break: break-word;
    }

    /* Sound Bars (Guaranteed to render in SL CEF) */
    .eq-container {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 8px;
      height: 50px;
      width: 100%;
      margin: 15px 0;
    }

    .bar {
      width: 10px;
      height: 8px;
      background-color: #00e5ff;
      border-radius: 4px;
    }

    #status {
      font-size: 1.1rem;
      color: #798ba3;
      margin-top: 15px;
    }

    #syncInfo {
      font-size: 0.85rem;
      color: #485466;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <div class="player-card">
    <div class="station-badge">
      <div class="pulse-dot"></div>
      <span>ON AIR</span>
    </div>

    <div id="title">Loading Stream...</div>

    <div class="eq-container" id="eq">
      <div class="bar" id="b1"></div>
      <div class="bar" id="b2"></div>
      <div class="bar" id="b3"></div>
      <div class="bar" id="b4"></div>
      <div class="bar" id="b5"></div>
      <div class="bar" id="b6"></div>
      <div class="bar" id="b7"></div>
      <div class="bar" id="b8"></div>
    </div>

    <div id="status">Syncing universal playback...</div>
    <div id="syncInfo"></div>
  </div>

  <audio id="player" preload="auto"></audio>

  <script>
    const params = new URLSearchParams(window.location.search);
    const audioUrl = params.get('url');
    const songName = params.get('name') || "Now Playing";
    const startTime = parseFloat(params.get('t') || "0");

    const audio = document.getElementById('player');
    const titleEl = document.getElementById('title');
    const statusEl = document.getElementById('status');
    const syncInfoEl = document.getElementById('syncInfo');
    const bars = [
      document.getElementById('b1'),
      document.getElementById('b2'),
      document.getElementById('b3'),
      document.getElementById('b4'),
      document.getElementById('b5'),
      document.getElementById('b6'),
      document.getElementById('b7'),
      document.getElementById('b8')
    ];

    let animInterval = null;

    function startVisualizer() {
      if (animInterval) clearInterval(animInterval);
      animInterval = setInterval(() => {
        bars.forEach(bar => {
          const h = Math.floor(Math.random() * 42) + 8;
          bar.style.height = h + 'px';
        });
      }, 120);
    }

    function stopVisualizer() {
      if (animInterval) clearInterval(animInterval);
      bars.forEach(bar => bar.style.height = '8px');
    }

    if (audioUrl) {
      titleEl.textContent = decodeURIComponent(songName);
      audio.src = audioUrl;

      audio.addEventListener('loadedmetadata', () => {
        if (startTime > 0 && !isNaN(startTime)) {
          audio.currentTime = startTime;
        }
        audio.play().then(() => {
          statusEl.textContent = "Broadcasting Synced Audio";
          syncInfoEl.textContent = "Offset: " + Math.round(startTime) + "s";
          startVisualizer();
        }).catch(() => {
          statusEl.textContent = "Audio ready";
        });
      }, { once: true });

      audio.addEventListener('ended', () => {
        statusEl.textContent = "Track finished. Awaiting next...";
        stopVisualizer();
      });

    } else {
      titleEl.textContent = "Jukebox Standby";
      statusEl.textContent = "Awaiting signal from SL...";
    }
  </script>
</body>
</html>
