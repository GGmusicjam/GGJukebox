<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SL Synced Jukebox Deck</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #06070a;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100vh;
      width: 100vw;
      padding: 20px;
      overflow: hidden;
      user-select: none;
      cursor: pointer;
    }

    /* Main High-Contrast Border Box */
    .deck-frame {
      width: 100%;
      height: 100%;
      border: 6px solid #00f0ff;
      border-radius: 20px;
      background-color: #10131d;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 25px 30px;
      position: relative;
    }

    /* ON AIR BADGE */
    .top-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 24px;
      background-color: #ff0077;
      border-radius: 25px;
    }

    .pulse-dot {
      width: 14px;
      height: 14px;
      background-color: #ffffff;
      border-radius: 50%;
    }

    .station-text {
      color: #ffffff;
      font-size: 1.3rem;
      letter-spacing: 2px;
      font-weight: bold;
    }

    /* SONG TITLE */
    #title {
      font-size: 2.6rem;
      font-weight: 900;
      color: #ffffff;
      text-align: center;
      line-height: 1.2;
      text-transform: uppercase;
      word-break: break-word;
      max-width: 95%;
      margin: 10px 0;
    }

    /* SOLID CANVAS VISUALIZER */
    #eqCanvas {
      width: 100%;
      height: 120px;
      background-color: #050608;
      border: 3px solid #00f0ff;
      border-radius: 12px;
      display: block;
    }

    /* BOTTOM STATUS */
    #status {
      font-size: 1.3rem;
      font-weight: bold;
      color: #00f0ff;
      letter-spacing: 1px;
    }

    /* INTERACTION OVERLAY (For Guests If Muted) */
    #clickOverlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(6, 7, 10, 0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      z-index: 10;
    }

    .click-btn {
      background-color: #ff0077;
      color: #ffffff;
      font-size: 2rem;
      padding: 20px 40px;
      border-radius: 18px;
      border: 4px solid #ffffff;
      text-transform: uppercase;
      font-weight: 900;
      letter-spacing: 2px;
    }
  </style>
</head>
<body onclick="unmuteAudio()">

  <div class="deck-frame">
    <!-- Overlay if Autoplay is blocked -->
    <div id="clickOverlay" style="display: none;">
      <div class="click-btn">🔊 CLICK TO TUNE IN</div>
    </div>

    <!-- Top Badge -->
    <div class="top-bar">
      <div class="pulse-dot"></div>
      <span class="station-text">LIVE ON AIR</span>
    </div>

    <!-- Song Title -->
    <div id="title">JUKEBOX STREAM</div>

    <!-- 100% Reliable 2D Canvas -->
    <canvas id="eqCanvas" width="800" height="160"></canvas>

    <!-- Bottom Status Text -->
    <div id="status">BROADCASTING SYNCHRONIZED AUDIO</div>
  </div>

  <audio id="player" preload="auto"></audio>

  <script>
    var params = new URLSearchParams(window.location.search);
    var audioUrl = params.get('url');
    var songName = params.get('name') || "Now Playing";
    var startTime = parseFloat(params.get('t') || "0");

    var audio = document.getElementById('player');
    var titleEl = document.getElementById('title');
    var statusEl = document.getElementById('status');
    var overlayEl = document.getElementById('clickOverlay');
    var canvas = document.getElementById('eqCanvas');
    var ctx = canvas.getContext('2d');

    // 16 Solid Equalizer Bars
    var NUM_BARS = 16;
    var heights = [25, 40, 60, 30, 80, 50, 90, 45, 70, 35, 85, 40, 65, 50, 75, 30];

    function drawBars() {
      // 1. Clear background to dark
      ctx.fillStyle = '#050608';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      var spacing = 10;
      var totalSpacing = spacing * (NUM_BARS + 1);
      var barWidth = (canvas.width - totalSpacing) / NUM_BARS;

      for (var i = 0; i < NUM_BARS; i++) {
        // Randomize heights
        if (Math.random() > 0.25) {
          heights[i] = Math.floor(Math.random() * (canvas.height - 35)) + 15;
        }

        var x = spacing + i * (barWidth + spacing);
        var y = canvas.height - heights[i] - 10;

        // Alternate Cyan (#00f0ff) and Magenta (#ff0077)
        ctx.fillStyle = (i % 2 === 0) ? '#00f0ff' : '#ff0077';
        
        // Rock-solid fillRect that works in all CEF versions
        ctx.fillRect(x, y, barWidth, heights[i]);
      }
    }

    // Run visualizer at 10 FPS
    setInterval(drawBars, 100);

    function unmuteAudio() {
      if (audioUrl) {
        audio.play().then(function() {
          overlayEl.style.display = "none";
          statusEl.textContent = "BROADCASTING SYNCHRONIZED AUDIO";
        });
      }
    }

    if (audioUrl) {
      titleEl.textContent = decodeURIComponent(songName);
      audio.src = audioUrl;

      audio.addEventListener('loadedmetadata', function() {
        if (startTime > 0 && !isNaN(startTime)) {
          audio.currentTime = startTime;
        }
        audio.play().then(function() {
          overlayEl.style.display = "none";
          statusEl.textContent = "BROADCASTING SYNCHRONIZED AUDIO";
        }).catch(function() {
          overlayEl.style.display = "flex";
          statusEl.textContent = "CLICK SCREEN TO UNMUTE";
        });
      }, { once: true });
    }
  </script>
</body>
</html>
