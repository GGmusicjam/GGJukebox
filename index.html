<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SL Synced DJ Deck</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #040508;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      padding: 14px;
      overflow: hidden;
      user-select: none;
      cursor: pointer;
    }

    .deck-frame {
      width: 100%;
      height: 100%;
      border: 4px solid #ff0044;
      border-radius: 22px;
      background-color: #0a0b12;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 16px 22px;
      position: relative;
      box-shadow: 0 0 25px rgba(255, 0, 68, 0.35);
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 0 4px;
    }

    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 16px;
      background-color: #ff0044;
      border-radius: 20px;
      box-shadow: 0 0 15px rgba(255, 0, 68, 0.6);
    }

    .pulse-dot {
      width: 10px;
      height: 10px;
      background-color: #ffffff;
      border-radius: 50%;
    }

    .station-text {
      color: #ffffff;
      font-size: 1rem;
      letter-spacing: 2px;
      font-weight: bold;
    }

    .sync-counter {
      font-size: 1.05rem;
      color: #b537f2;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .mid-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 0 10px;
      gap: 20px;
      margin: 4px 0;
    }

    #title {
      font-size: 2.1rem;
      font-weight: 900;
      color: #ffffff;
      line-height: 1.15;
      text-transform: uppercase;
      word-break: break-word;
      text-shadow: 0 0 16px rgba(181, 55, 242, 0.8);
      flex: 1;
    }

    .gg-emblem-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 76px;
      height: 76px;
      min-width: 76px;
      margin-right: 25px;
      border-radius: 50%;
      border: 3px solid #ff0044;
      background: radial-gradient(circle at 35% 35%, #3d0a47 0%, #0d0718 100%);
      box-shadow: 0 0 20px rgba(255, 0, 68, 0.7), inset 0 0 15px rgba(157, 0, 255, 0.6);
      position: relative;
      transform-origin: center center;
    }

    .gg-emblem-wrap::before {
      content: '';
      position: absolute;
      width: 88px;
      height: 88px;
      border-radius: 50%;
      border: 2px dashed #9d00ff;
      opacity: 0.8;
    }

    .gg-emblem-text {
      font-family: 'Arial Black', Impact, sans-serif;
      font-size: 2.1rem;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 2px;
      text-shadow: 0 0 10px #ff0044, 0 0 20px #9d00ff, 0 0 30px #00f0ff;
    }

    #visualStage {
      width: 100%;
      height: 250px;
      background-color: #040508;
      border: 2px solid #23192d;
      border-radius: 12px;
      display: block;
    }

    .progress-wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 7px;
      background-color: #181422;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(to right, #ff0044, #9d00ff);
      border-radius: 4px;
      transition: width 0.3s linear;
    }

    .bottom-info {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 0.95rem;
      font-weight: bold;
      color: #79718a;
    }

    #clickOverlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(4, 5, 8, 0.94);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 20px;
      z-index: 100;
    }

    .click-btn {
      background: linear-gradient(135deg, #ff0044, #9d00ff);
      color: #ffffff;
      font-size: 1.9rem;
      padding: 18px 38px;
      border-radius: 18px;
      border: 3px solid #ffffff;
      text-transform: uppercase;
      font-weight: 900;
      letter-spacing: 2px;
      box-shadow: 0 0 35px rgba(255, 0, 68, 0.8);
    }
  </style>
</head>
<body onclick="handleUserUnlock()">

  <div class="deck-frame" id="frameBox">
    <div id="clickOverlay" style="display: none;">
      <div class="click-btn">🔊 CLICK TO TUNE IN</div>
    </div>

    <div class="top-bar">
      <div class="badge-pill">
        <div class="pulse-dot"></div>
        <span class="station-text">LIVE STREAM</span>
      </div>
      <div class="sync-counter" id="timeDisplay">0:00 / 0:00</div>
    </div>

    <div class="mid-header-row">
      <div id="title">JUKEBOX STANDBY</div>
      <div class="gg-emblem-wrap" id="ggBadge">
        <span class="gg-emblem-text">GG</span>
      </div>
    </div>

    <canvas id="visualStage" width="800" height="340"></canvas>

    <div class="progress-wrap">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
      <div class="bottom-info">
        <span id="status">SYNCHRONIZED BROADCAST ACTIVE</span>
        <span>GG AUDIO ENGINE</span>
      </div>
    </div>
  </div>

  <audio id="player" preload="auto"></audio>

  <script>
    var params = new URLSearchParams(window.location.search);
    var audioUrl = params.get('url');
    var songName = params.get('name') || "Now Playing";
    var startTime = parseFloat(params.get('t') || "0");

    var audio = document.getElementById('player');
    audio.crossOrigin = "anonymous";

    var titleEl = document.getElementById('title');
    var statusEl = document.getElementById('status');
    var timeDisplay = document.getElementById('timeDisplay');
    var progressFill = document.getElementById('progressFill');
    var overlayEl = document.getElementById('clickOverlay');
    var frameBox = document.getElementById('frameBox');
    var ggBadge = document.getElementById('ggBadge');
    var canvas = document.getElementById('visualStage');
    var ctx = canvas.getContext('2d');

    var NUM_BARS = 22;
    var peaks = new Array(NUM_BARS).fill(0);
    var currentHeights = new Array(NUM_BARS).fill(6);
    var smoothedKick = 0;
    var seekDone = false;

    // Web Audio API Nodes
    var audioCtx = null;
    var analyser = null;
    var sourceNode = null;
    var freqData = null;

    function initAudioContext() {
      if (audioCtx) return;
      try {
        var AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 64; // 32 frequency bins
        // 0.89 smoothing: filters out micro-jitter while preserving big rhythm pulses
        analyser.smoothingTimeConstant = 0.89;

        sourceNode = audioCtx.createMediaElementSource(audio);
        sourceNode.connect(analyser);
        analyser.connect(audioCtx.destination);

        freqData = new Uint8Array(analyser.frequencyBinCount);
      } catch (err) {
        console.warn("Web Audio API CORS notice:", err);
      }
    }

    function formatTime(sec) {
      if (isNaN(sec) || sec < 0) return "0:00";
      var h = Math.floor(sec / 3600);
      var m = Math.floor((sec % 3600) / 60);
      var s = Math.floor(sec % 60);
      if (h > 0) {
        return h + ":" + (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
      }
      return m + ":" + (s < 10 ? "0" : "") + s;
    }

    function render() {
      ctx.fillStyle = '#040508';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      var hasRealAudio = false;
      var bassLevel = 0;

      if (analyser && !audio.paused) {
        analyser.getByteFrequencyData(freqData);
        bassLevel = Math.max(freqData[0], freqData[1], freqData[2]);
        if (bassLevel > 0) hasRealAudio = true;
      }

      // Bass gate and smooth breathing scale for GG Emblem
      var normBass = bassLevel / 255;
      if (normBass < 0.15) {
        normBass = 0;
      } else {
        normBass = (normBass - 0.15) / 0.85;
      }

      var targetKick = Math.pow(normBass, 2.0);
      // Gentle, heavy swell on kicks without twitch
      smoothedKick += (targetKick - smoothedKick) * 0.14;

      var pulseScale = 1.0 + (smoothedKick * 0.30);
      ggBadge.style.transform = "scale(" + pulseScale.toFixed(3) + ")";

      if (bassLevel > 185) {
        ggBadge.style.borderColor = '#00f0ff';
        ggBadge.style.boxShadow = "0 0 28px #00f0ff, 0 0 45px #ff0044";
      } else {
        ggBadge.style.borderColor = (bassLevel > 110) ? '#ff0044' : '#9d00ff';
        ggBadge.style.boxShadow = "0 0 " + Math.floor(smoothedKick * 24 + 8) + "px rgba(255, 0, 68, 0.7)";
      }

      var frameGlow = Math.floor(smoothedKick * 26) + 10;
      frameBox.style.boxShadow = "0 0 " + frameGlow + "px rgba(255, 0, 68, 0.35)";

      // Bars Calculation
      var spacing = 8;
      var totalSpacing = spacing * (NUM_BARS + 1);
      var barWidth = (canvas.width - totalSpacing) / NUM_BARS;
      var maxBarHeight = canvas.height - 40;

      for (var i = 0; i < NUM_BARS; i++) {
        var targetHeight = 6;

        if (!audio.paused) {
          if (hasRealAudio) {
            var rawBin = freqData[i] || 0;
            var normVal = rawBin / 255;

            // Noise gate: cuts off low-level noise floor to prevent micro-twitching
            if (normVal < 0.14) {
              normVal = 0;
            } else {
              normVal = (normVal - 0.14) / 0.86;
            }

            // Power curve: makes drops punch and gives clean headroom in valleys
            var expandedVal = Math.pow(normVal, 1.75);
            targetHeight = 6 + (expandedVal * maxBarHeight);
          } else {
            // Idle ambient wave
            targetHeight = 6 + Math.abs(Math.sin((Date.now() * 0.002) + (i * 0.25))) * 32;
          }
        }

        // Heavy smooth rise: climbs without snapping or spasming
        if (targetHeight > currentHeights[i]) {
          currentHeights[i] += (targetHeight - currentHeights[i]) * 0.18;
        } else {
          // Linear glide drop: gives that weighty, buttery bounce
          currentHeights[i] -= 2.4;
          if (currentHeights[i] < 6) currentHeights[i] = 6;
        }

        // Smooth peak caps that float downward gracefully
        if (currentHeights[i] >= peaks[i]) {
          peaks[i] = currentHeights[i];
        } else {
          peaks[i] -= 1.1;
          if (peaks[i] < 6) peaks[i] = 6;
        }

        var x = spacing + i * (barWidth + spacing);
        var y = canvas.height - currentHeights[i] - 8;

        ctx.fillStyle = (i % 2 === 0) ? '#ff0044' : '#9d00ff';
        ctx.fillRect(x, y, barWidth, currentHeights[i]);

        if (peaks[i] > 10) {
          ctx.fillStyle = '#ffffff';
          var peakY = canvas.height - peaks[i] - 12;
          if (peakY < 6) peakY = 6;
          ctx.fillRect(x, peakY, barWidth, 3);
        }
      }

      if (audio.duration && !isNaN(audio.duration)) {
        var pct = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = pct + "%";
        timeDisplay.textContent = formatTime(audio.currentTime) + " / " + formatTime(audio.duration);
      }

      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);

    function startPlayback() {
      initAudioContext();
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      audio.play().then(function() {
        overlayEl.style.display = "none";
        statusEl.textContent = "SYNCHRONIZED BROADCAST ACTIVE";
      }).catch(function() {
        overlayEl.style.display = "flex";
        statusEl.textContent = "CLICK SCREEN TO UNMUTE";
      });
    }

    function handleUserUnlock() {
      startPlayback();
    }

    if (audioUrl) {
      titleEl.textContent = decodeURIComponent(songName);

      var streamUrl = audioUrl
        .replace("www.dropbox.com", "dl.dropboxusercontent.com")
        .replace("?dl=0", "")
        .replace("&dl=0", "");

      if (streamUrl.indexOf("dl.dropboxusercontent.com") !== -1 && streamUrl.indexOf("?") === -1) {
        streamUrl += "?raw=1";
      }

      audio.src = streamUrl;

      audio.addEventListener('loadedmetadata', function() {
        if (!seekDone && startTime > 0 && !isNaN(startTime)) {
          audio.currentTime = startTime;
          seekDone = true;
        }
        startPlayback();
      });

      audio.addEventListener('canplay', function() {
        if (!seekDone && startTime > 0 && !isNaN(startTime)) {
          audio.currentTime = startTime;
          seekDone = true;
        }
      });
    }
  </script>
</body>
</html>
