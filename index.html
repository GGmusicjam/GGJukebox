<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SL Synced Jukebox Deck</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(circle at 50% 50%, #161824 0%, #08090d 100%);
      color: #ffffff;
      font-family: 'Arial Black', Impact, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100vh;
      width: 100vw;
      padding: 30px;
      overflow: hidden;
      user-select: none;
      cursor: pointer;
    }

    /* Outer Neon Border Frame */
    .deck-frame {
      width: 100%;
      height: 100%;
      border: 4px solid #00f0ff;
      border-radius: 28px;
      box-shadow: inset 0 0 30px rgba(0, 240, 255, 0.2), 0 0 40px rgba(0, 240, 255, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 30px 40px;
      background: rgba(15, 17, 26, 0.92);
      position: relative;
    }

    /* Top Bar: Station Badge */
    .top-bar {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 8px 24px;
      background: rgba(255, 0, 128, 0.15);
      border: 2px solid #ff0080;
      border-radius: 30px;
      box-shadow: 0 0 15px rgba(255, 0, 128, 0.4);
    }

    .pulse-dot {
      width: 16px;
      height: 16px;
      background: #ff0080;
      border-radius: 50%;
      box-shadow: 0 0 15px #ff0080;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(0.8); opacity: 0.7; }
      100% { transform: scale(1.3); opacity: 1; }
    }

    .station-text {
      color: #ff0080;
      font-size: 1.4rem;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    /* Center: Song Title (Huge & Bold) */
    #title {
      font-size: 3.2rem;
      color: #ffffff;
      text-align: center;
      line-height: 1.15;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
      word-break: break-word;
      max-width: 95%;
      margin: 10px 0;
    }

    /* Equalizer Sound Bars (Thick & Glowing) */
    .eq-container {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 14px;
      height: 110px;
      width: 100%;
      margin-bottom: 10px;
    }

    .bar {
      width: 22px;
      height: 25px;
      background: linear-gradient(to top, #ff0080 0%, #00f0ff 100%);
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
      transition: height 0.1s ease;
    }

    /* Bottom Subtext */
    #status {
      font-family: Arial, sans-serif;
      font-size: 1.25rem;
      font-weight: bold;
      color: #00f0ff;
      letter-spacing: 1px;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    }

    /* Centered Interaction Modal if Audio is Blocked */
    #clickOverlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(8, 9, 13, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 24px;
      z-index: 10;
    }

    .click-btn {
      background: linear-gradient(135deg, #ff0080, #7928ca);
      color: #ffffff;
      font-size: 1.8rem;
      padding: 18px 36px;
      border-radius: 18px;
      border: 2px solid #ffffff;
      box-shadow: 0 0 35px rgba(255, 0, 128, 0.8);
      text-transform: uppercase;
      letter-spacing: 2px;
      animation: floatBtn 1.5s infinite ease-in-out;
    }

    @keyframes floatBtn {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
  </style>
</head>
<body onclick="unmuteAudio()">

  <div class="deck-frame">
    <!-- Click Overlay (Appears if browser mutes autoplay) -->
    <div id="clickOverlay" style="display: none;">
      <div class="click-btn">🔊 CLICK TO TUNE IN</div>
    </div>

    <!-- Top Badge -->
    <div class="top-bar">
      <div class="pulse-dot"></div>
      <span class="station-text">LIVE STREAM</span>
    </div>

    <!-- Song Name -->
    <div id="title">JUKEBOX READY</div>

    <!-- Big Sound Bars -->
    <div class="eq-container">
      <div class="bar" id="b1"></div>
      <div class="bar" id="b2"></div>
      <div class="bar" id="b3"></div>
      <div class="bar" id="b4"></div>
      <div class="bar" id="b5"></div>
      <div class="bar" id="b6"></div>
      <div class="bar" id="b7"></div>
      <div class="bar" id="b8"></div>
      <div class="bar" id="b9"></div>
      <div class="bar" id="b10"></div>
    </div>

    <!-- Bottom Status -->
    <div id="status">SYNCHRONIZED AUDIO BROADCAST</div>
  </div>

  <audio id="player" preload="auto"></audio>

  <script>
    const params = new URLSearchParams(window.location.search);
    const audioUrl = params.get('url');
    const songName = params.get('name') || "Now Playing";
    const startTime = parseFloat(params.get('t') || "0");

    const audio = document.getElementById('player');
    const titleEl = document.getElementById('title');
    const statusEl = document.getElementById('status');
    const overlayEl = document.getElementById('clickOverlay');
    const bars = [
      document.getElementById('b1'), document.getElementById('b2'),
      document.getElementById('b3'), document.getElementById('b4'),
      document.getElementById('b5'), document.getElementById('b6'),
      document.getElementById('b7'), document.getElementById('b8'),
      document.getElementById('b9'), document.getElementById('b10')
    ];

    // Constantly active visualizer bounce loop
    setInterval(() => {
      bars.forEach(bar => {
        const h = Math.floor(Math.random() * 95) + 15;
        bar.style.height = h + 'px';
      });
    }, 100);

    function unmuteAudio() {
      if (audioUrl) {
        audio.play().then(() => {
          overlayEl.style.display = "none";
          statusEl.textContent = "SYNCHRONIZED BROADCAST ACTIVE";
        });
      }
    }

    if (audioUrl) {
      titleEl.textContent = decodeURIComponent(songName);
      audio.src = audioUrl;

      audio.addEventListener('loadedmetadata', () => {
        if (startTime > 0 && !isNaN(startTime)) {
          audio.currentTime = startTime;
        }
        audio.play().then(() => {
          overlayEl.style.display = "none";
          statusEl.textContent = "SYNCHRONIZED BROADCAST ACTIVE";
        }).catch(() => {
          // Autoplay blocked by viewer CEF -> show click overlay
          overlayEl.style.display = "flex";
          statusEl.textContent = "CLICK SCREEN TO UNMUTE";
        });
      }, { once: true });
    }
  </script>
</body>
</html>
