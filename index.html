<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SL Synced Jukebox Deck</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #08090d;
      color: #ffffff;
      font-family: 'Arial Black', Impact, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100vh;
      width: 100vw;
      padding: 24px;
      overflow: hidden;
      user-select: none;
      cursor: pointer;
    }

    .deck-frame {
      width: 100%;
      height: 100%;
      border: 6px solid #00f0ff;
      border-radius: 24px;
      background-color: #12151f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 25px 30px;
      position: relative;
    }

    .top-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 24px;
      background-color: #ff0077;
      border-radius: 30px;
    }

    .pulse-dot {
      width: 14px;
      height: 14px;
      background-color: #ffffff;
      border-radius: 50%;
    }

    .station-text {
      color: #ffffff;
      font-size: 1.3rem;
      letter-spacing: 2px;
      font-weight: 900;
    }

    #title {
      font-size: 2.8rem;
      color: #ffffff;
      text-align: center;
      line-height: 1.15;
      text-transform: uppercase;
      word-break: break-word;
      max-width: 95%;
      margin: 10px 0;
    }

    /* HTML5 2D Canvas Equalizer */
    #eqCanvas {
      width: 100%;
      height: 110px;
      background-color: #0a0b10;
      border-radius: 12px;
      border: 2px solid #252c3d;
    }

    #status {
      font-family: Arial, sans-serif;
      font-size: 1.3rem;
      font-weight: bold;
      color: #00f0ff;
      letter-spacing: 1px;
    }

    /* Unmute Banner if Viewer Blocks Autoplay */
    #clickOverlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(8, 9, 13, 0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      z-index: 10;
    }

    .click-btn {
      background-color: #ff0077;
      color: #ffffff;
      font-size: 2rem;
      padding: 20px 40px;
      border-radius: 20px;
      border: 4px solid #ffffff;
      text-transform: uppercase;
      font-weight: 900;
      letter-spacing: 2px;
    }
  </style>
</head>
<body onclick="unmuteAudio()">

  <div class="deck-frame">
    <!-- Centered Unlock Overlay (Appears for friends if their viewer mutes sound) -->
    <div id="clickOverlay" style="display: none;">
      <div class="click-btn">🔊 CLICK TO TUNE IN</div>
    </div>

    <!-- Top Badge -->
    <div class="top-bar">
      <div class="pulse-dot"></div>
      <span class="station-text">LIVE ON AIR</span>
    </div>

    <!-- Song Title -->
    <div id="title">JUKEBOX STREAM</div>

    <!-- Canvas Equalizer (100% Reliable Rendering) -->
    <canvas id="eqCanvas" width="800" height="150"></canvas>

    <!-- Status Text -->
    <div id="status">BROADCASTING SYNCHRONIZED AUDIO</div>
  </div>

  <audio id="player" preload="auto"></audio>

  <script>
    const params = new URLSearchParams(window.location.search);
    const audioUrl = params.get('url');
    const songName = params.get('name') || "Now Playing";
    const startTime = parseFloat(params.get('t') || "0");

    const audio = document.getElementById('player');
    const titleEl = document.getElementById('title');
    const statusEl = document.getElementById('status');
    const overlayEl = document.getElementById('clickOverlay');
    const canvas = document.getElementById('eqCanvas');
    const ctx = canvas.getContext('2d');

    // 16 Solid Equalizer Bars drawn directly on Canvas
    const NUM_BARS = 16;
    let heights = new Array(NUM_BARS).fill(20);

    function drawBars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const totalSpacing = canvas.width * 0.02;
      const barWidth = (canvas.width - (totalSpacing * (NUM_BARS + 1))) / NUM_BARS;

      for (let i = 0; i < NUM_BARS; i++) {
        // Target randomized height
        if (Math.random() > 0.3) {
          heights[i] = Math.floor(Math.random() * (canvas.height - 30)) + 15;
        }

        const x = totalSpacing + i * (barWidth + totalSpacing);
        const y = canvas.height - heights[i] - 10;

        // Alternate Cyan and Magenta bars
        ctx.fillStyle = (i % 2 === 0) ? '#00f0ff' : '#ff0077';
        ctx.beginPath();
        ctx.roundRect(x, y, barWidth, heights[i], 6);
        ctx.fill();
      }
    }

    setInterval(drawBars, 100);

    function unmuteAudio() {
      if (audioUrl) {
        audio.play().then(() => {
          overlayEl.style.display = "none";
          statusEl.textContent = "BROADCASTING SYNCHRONIZED AUDIO";
        });
      }
    }

    if (audioUrl) {
      titleEl.textContent = decodeURIComponent(songName);
      audio.src = audioUrl;

      audio.addEventListener('loadedmetadata', () => {
        if (startTime > 0 && !isNaN(startTime)) {
          audio.currentTime = startTime;
        }
        audio.play().then(() => {
          overlayEl.style.display = "none";
          statusEl.textContent = "BROADCASTING SYNCHRONIZED AUDIO";
        }).catch(() => {
          // Autoplay blocked by visitor's viewer -> show large click button
          overlayEl.style.display = "flex";
          statusEl.textContent = "CLICK SCREEN TO UNMUTE";
        });
      }, { once: true });
    }
  </script>
</body>
</html>
