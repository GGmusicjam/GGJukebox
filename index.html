<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GG Audio Engine — Live Stream</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #0d0d12;
      color: #ffffff;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    .deck-frame {
      width: 100%;
      height: 100%;
      padding: 20px 26px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      background: radial-gradient(circle at 50% 25%, #1a1626 0%, #0d0d12 75%);
      border: 4px solid #ff0055;
      box-shadow: inset 0 0 32px rgba(255, 0, 85, 0.35);
      position: relative;
    }

    /* Top Bar — Larger, Easy-to-Click HUD Controls */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      z-index: 2;
    }

    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(90deg, #ff0055, #c80046);
      padding: 9px 18px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 1.5px;
      box-shadow: 0 0 16px rgba(255, 0, 85, 0.6);
      flex-shrink: 0;
    }

    .live-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #ffffff;
      animation: pulseDot 1.4s infinite ease-in-out;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.75); }
    }

    .right-controls {
      display: flex;
      align-items: center;
      gap: 18px;
      background: rgba(20, 20, 32, 0.92);
      border: 2px solid rgba(255, 255, 255, 0.16);
      padding: 8px 18px;
      border-radius: 999px;
    }

    .resync-btn {
      background: rgba(255, 0, 85, 0.25);
      border: 2px solid #ff0055;
      color: #ffffff;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 1px;
      padding: 8px 18px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(255, 0, 85, 0.4);
      transition: all 0.15s ease;
    }

    .resync-btn:hover {
      background: #ff0055;
      box-shadow: 0 0 18px rgba(255, 0, 85, 0.85);
    }

    .resync-btn.synced {
      border-color: #00f0ff;
      background: rgba(0, 240, 255, 0.25);
      color: #00f0ff;
      box-shadow: 0 0 14px rgba(0, 240, 255, 0.6);
    }

    .vol-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .mute-btn {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 24px;
      cursor: pointer;
      padding: 2px 4px;
      line-height: 1;
    }

    input[type="range"].vol-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 175px;
      height: 12px;
      background: #2b2b3d;
      border-radius: 999px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"].vol-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #00f0ff;
      border: 2px solid #ffffff;
      box-shadow: 0 0 14px #00f0ff;
      cursor: pointer;
    }

    .vol-label {
      font-size: 17px;
      font-weight: 800;
      color: #00f0ff;
      min-width: 48px;
      text-align: right;
    }

    .time-readout {
      font-size: 16px;
      font-weight: 800;
      color: #b784ff;
      letter-spacing: 0.6px;
      min-width: 102px;
      text-align: right;
    }

    /* Center Header: Larger Song Title + GG Emblem */
    .track-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 2px 4px;
    }

    .track-title {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 0 18px rgba(183, 132, 255, 0.65);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 84%;
    }

    .gg-badge {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      border: 3px solid #00f0ff;
      background: radial-gradient(circle, #2a123d 0%, #12101c 80%);
      box-shadow: 0 0 22px rgba(0, 240, 255, 0.7), inset 0 0 14px rgba(255, 0, 85, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #ffffff;
      text-shadow: 0 0 10px #ff0055;
      flex-shrink: 0;
      transition: transform 0.1s ease-out;
    }

    /* Expanded Equalizer Visualizer Stage */
    .viz-stage {
      width: 100%;
      flex: 1;
      min-height: 180px;
      background: rgba(12, 12, 18, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 16px 16px 10px 16px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 7px;
    }

    .eq-col {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      position: relative;
    }

    .eq-cap {
      width: 100%;
      height: 4px;
      background: #ffffff;
      border-radius: 2px;
      margin-bottom: 4px;
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.85);
    }

    .eq-bar {
      width: 100%;
      height: 8%;
      border-radius: 4px 4px 0 0;
      transition: height 0.065s ease-out;
    }

    .eq-bar.pink {
      background: linear-gradient(180deg, #ff1e6e 0%, #b80044 100%);
      box-shadow: 0 0 12px rgba(255, 30, 110, 0.5);
    }

    .eq-bar.purple {
      background: linear-gradient(180deg, #b829ff 0%, #6800b8 100%);
      box-shadow: 0 0 12px rgba(184, 41, 255, 0.5);
    }

    /* Bottom Progress & Footer */
    .bottom-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #ff0055, #b829ff, #00f0ff);
      box-shadow: 0 0 12px rgba(184, 41, 255, 0.75);
      transition: width 0.25s linear;
    }

    .footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: rgba(255, 255, 255, 0.6);
    }

    .tap-overlay {
      position: absolute;
      inset: 0;
      background: rgba(10, 10, 16, 0.88);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10;
      cursor: pointer;
    }

    .tap-btn {
      background: linear-gradient(90deg, #ff0055, #b829ff);
      border: 2px solid #ffffff;
      color: #ffffff;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 1.5px;
      padding: 16px 32px;
      border-radius: 999px;
      box-shadow: 0 0 28px rgba(255, 0, 85, 0.85);
    }
  </style>
</head>
<body>
  <div class="deck-frame">
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="live-pill">
        <span class="live-dot"></span>
        <span>LIVE STREAM</span>
      </div>

      <div class="right-controls" id="hudControls">
        <button id="resyncBtn" class="resync-btn" title="Resync Audio Stream">&#x21BB; RESYNC</button>

        <div class="vol-group">
          <button id="muteBtn" class="mute-btn" title="Mute / Unmute">&#x1F50A;</button>
          <input id="volSlider" class="vol-slider" type="range" min="0" max="100" value="25" />
          <span id="volLabel" class="vol-label">25%</span>
        </div>

        <span id="timeReadout" class="time-readout">0:00 / 0:00</span>
      </div>
    </div>

    <!-- Track Title & GG Emblem -->
    <div class="track-header">
      <div id="trackTitle" class="track-title">LOADING STREAM...</div>
      <div id="ggBadge" class="gg-badge">GG</div>
    </div>

    <!-- 22-Bar Equalizer Stage -->
    <div id="vizStage" class="viz-stage"></div>

    <!-- Bottom Progress & Engine Status -->
    <div class="bottom-section">
      <div class="progress-track">
        <div id="progressFill" class="progress-fill"></div>
      </div>
      <div class="footer-row">
        <span id="modeStatus">SYNCHRONIZED BROADCAST ACTIVE</span>
        <span>GG AUDIO ENGINE</span>
      </div>
    </div>

    <!-- Autoplay Fallback Overlay -->
    <div id="tapOverlay" class="tap-overlay">
      <div class="tap-btn">&#9654; CLICK TO UNMUTE AUDIO</div>
    </div>
  </div>

  <audio id="audioPlayer" crossorigin="anonymous" preload="auto"></audio>

  <script>
    const params         = new URLSearchParams(window.location.search);
    const streamUrl      = params.get('url') || '';
    const trackName      = params.get('name') || 'GG LIVE STREAM';
    const startOffset    = parseFloat(params.get('t') || '0');
    const syncStamp      = parseFloat(params.get('sync') || '0');
    const zoneDefaultVol = Math.min(100, Math.max(0, parseInt(params.get('vol') || '25', 10)));
    const isWallMuted    = params.get('mute') === '1';

    const STORAGE_VOL_KEY  = 'ggjukebox_personal_vol';
    const STORAGE_MUTE_KEY = 'ggjukebox_personal_mute';

    function getSavedPersonalVol() {
      try {
        const saved = localStorage.getItem(STORAGE_VOL_KEY);
        if (saved !== null && saved !== '') {
          const parsed = parseInt(saved, 10);
          if (!isNaN(parsed)) return Math.min(100, Math.max(0, parsed));
        }
      } catch (e) {}
      return null;
    }

    function getSavedPersonalMute() {
      try {
        return localStorage.getItem(STORAGE_MUTE_KEY) === '1';
      } catch (e) {}
      return false;
    }

    function savePersonalAudioState(volPct, mutedBool) {
      try {
        localStorage.setItem(STORAGE_VOL_KEY, String(volPct));
        localStorage.setItem(STORAGE_MUTE_KEY, mutedBool ? '1' : '0');
      } catch (e) {}
    }

    const audio        = document.getElementById('audioPlayer');
    const trackTitleEl = document.getElementById('trackTitle');
    const timeReadout  = document.getElementById('timeReadout');
    const progressFill = document.getElementById('progressFill');
    const volSlider    = document.getElementById('volSlider');
    const volLabel     = document.getElementById('volLabel');
    const muteBtn      = document.getElementById('muteBtn');
    const resyncBtn    = document.getElementById('resyncBtn');
    const hudControls  = document.getElementById('hudControls');
    const modeStatus   = document.getElementById('modeStatus');
    const vizStage     = document.getElementById('vizStage');
    const ggBadge      = document.getElementById('ggBadge');
    const tapOverlay   = document.getElementById('tapOverlay');

    trackTitleEl.textContent = trackName;

    function applySafeVolume(pct, forceMute) {
      const clamped = Math.min(100, Math.max(0, pct));
      const isMuted = Boolean(forceMute) || (clamped === 0);
      audio.muted = isMuted;
      audio.volume = isMuted ? 0 : Math.pow(clamped / 100, 1.45) * 0.75;
    }

    const BAR_COUNT = 22;
    const bars = [];
    const caps = [];
    const barHeights = new Array(BAR_COUNT).fill(8);
    const capHeights = new Array(BAR_COUNT).fill(10);

    for (let i = 0; i < BAR_COUNT; i++) {
      const col = document.createElement('div');
      col.className = 'eq-col';

      const cap = document.createElement('div');
      cap.className = 'eq-cap';

      const bar = document.createElement('div');
      bar.className = 'eq-bar ' + (i % 2 === 0 ? 'pink' : 'purple');

      col.appendChild(cap);
      col.appendChild(bar);
      vizStage.appendChild(col);

      bars.push(bar);
      caps.push(cap);
    }

    function formatTime(sec) {
      if (!isFinite(sec) || sec < 0) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return m + ':' + (s < 10 ? '0' : '') + s;
    }

    function computeLiveOffset() {
      if (syncStamp > 0) {
        const nowSec = Math.floor(Date.now() / 1000);
        return startOffset + Math.max(0, nowSec - syncStamp);
      }
      return startOffset;
    }

    function seekToLive() {
      const target = computeLiveOffset();
      if (isFinite(audio.duration) && audio.duration > 0) {
        if (target < audio.duration) {
          audio.currentTime = target;
        }
      } else if (target > 0) {
        audio.currentTime = target;
      }
    }

    if (isWallMuted) {
      audio.muted = true;
      audio.volume = 0;
      hudControls.style.display = 'none';
      modeStatus.textContent = 'VISUAL DISPLAY MODE (HUD AUDIO)';
      audio.addEventListener('volumechange', () => {
        if (!audio.muted || audio.volume !== 0) {
          audio.muted = true;
          audio.volume = 0;
        }
      });
    } else {
      const personalVol  = getSavedPersonalVol();
      const personalMute = getSavedPersonalMute();
      const activeVol    = (personalVol !== null) ? personalVol : zoneDefaultVol;

      applySafeVolume(activeVol, personalMute);
      volSlider.value = activeVol;
      volLabel.textContent = personalMute ? '0%' : (activeVol + '%');
      muteBtn.innerHTML = (personalMute || activeVol === 0) ? '&#x1F507;' : '&#x1F50A;';
    }

    volSlider.addEventListener('input', () => {
      if (isWallMuted) return;
      const val = parseInt(volSlider.value, 10);
      applySafeVolume(val, val === 0);
      savePersonalAudioState(val, val === 0);
      volLabel.textContent = val + '%';
      muteBtn.innerHTML = val === 0 ? '&#x1F507;' : '&#x1F50A;';
    });

    muteBtn.addEventListener('click', () => {
      if (isWallMuted) return;
      const nextMuted = !audio.muted;
      const sliderVal = parseInt(volSlider.value, 10) || zoneDefaultVol || 25;
      applySafeVolume(sliderVal, nextMuted);
      savePersonalAudioState(sliderVal, nextMuted);
      if (nextMuted) {
        volLabel.textContent = '0%';
        muteBtn.innerHTML = '&#x1F507;';
      } else {
        volLabel.textContent = sliderVal + '%';
        muteBtn.innerHTML = '&#x1F50A;';
      }
    });

    resyncBtn.addEventListener('click', () => {
      seekToLive();
      audio.play().catch(() => {});
      resyncBtn.textContent = '✓ SYNCED';
      resyncBtn.classList.add('synced');
      setTimeout(() => {
        resyncBtn.innerHTML = '&#x21BB; RESYNC';
        resyncBtn.classList.remove('synced');
      }, 1500);
    });

    let audioCtx = null;
    let analyser = null;
    let freqData = null;
    let analyserReady = false;

    function initAudioAnalyser() {
      if (analyserReady || isWallMuted) return;
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
        const src = audioCtx.createMediaElementSource(audio);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        analyser.smoothingTimeConstant = 0.68;
        src.connect(analyser);
        analyser.connect(audioCtx.destination);
        freqData = new Uint8Array(analyser.frequencyBinCount);
        analyserReady = true;
      } catch (e) {
        analyserReady = false;
      }
    }

    function renderVisualizer() {
      requestAnimationFrame(renderVisualizer);

      let hasLiveSignal = false;
      if (!isWallMuted && analyserReady && analyser && !audio.paused) {
        analyser.getByteFrequencyData(freqData);
        for (let k = 0; k < 48; k++) {
          if (freqData[k] > 5) {
            hasLiveSignal = true;
            break;
          }
        }
      }

      const sec = performance.now() * 0.001;
      let bassEnergy = 0;

      for (let i = 0; i < BAR_COUNT; i++) {
        let targetPct = 8;

        if (hasLiveSignal) {
          let norm = 0;
          let gate = 0.40;

          if (i < 7) {
            // Bars 0-6 (7 bars): BASS & KICK (bins 2..8)
            const bin = 2 + i;
            norm = (freqData[bin] / 255) * 0.78;
            gate = 0.52;
          } else if (i < 15) {
            // Bars 7-14 (8 bars): MIDS, VOCALS & SYNTHS (bins 10..24)
            const midIdx = i - 7;
            const bin = 10 + midIdx * 2;
            norm = (freqData[bin] / 255) * 1.15;
            gate = 0.36;
          } else {
            // Bars 15-21 (7 bars): TREBLE, HI-HATS & SNARES (bins 28..52)
            const highIdx = i - 15;
            const bin = Math.min(freqData.length - 1, 28 + highIdx * 4);
            norm = (freqData[bin] / 255) * 1.75;
            gate = 0.22;
          }

          norm = Math.min(1.0, norm);

          if (norm < gate) {
            targetPct = 8 + (norm / gate) * 10;
          } else {
            const activeRatio = (norm - gate) / (1.0 - gate);
            targetPct = Math.min(98, 18 + Math.pow(activeRatio, 0.85) * 80);
          }
        } else {
          // Both Wall Display (&mute=1) and HUD Idle: Smooth, low-profile rolling sine wave
          const wave = Math.sin(sec * 1.6 - i * 0.42) * 0.5 + 0.5;
          targetPct = 8 + wave * 16;
        }

        if (targetPct > barHeights[i]) {
          barHeights[i] += (targetPct - barHeights[i]) * 0.45;
        } else {
          barHeights[i] += (targetPct - barHeights[i]) * 0.16;
        }

        if (barHeights[i] > capHeights[i]) {
          capHeights[i] = barHeights[i];
        } else {
          capHeights[i] = Math.max(barHeights[i], capHeights[i] - 0.65);
        }

        bars[i].style.height = barHeights[i].toFixed(1) + '%';
        if (i < 5) bassEnergy += barHeights[i];
      }

      const avgBass = bassEnergy / 5;
      const scale = 1 + Math.max(0, (avgBass - 45) / 360);
      ggBadge.style.transform = 'scale(' + scale.toFixed(3) + ')';
    }

    audio.addEventListener('timeupdate', () => {
      const cur = audio.currentTime || 0;
      const dur = audio.duration || 0;
      timeReadout.textContent = formatTime(cur) + ' / ' + formatTime(dur);
      if (isFinite(dur) && dur > 0) {
        progressFill.style.width = Math.min(100, (cur / dur) * 100).toFixed(2) + '%';
      }
    });

    if (streamUrl) {
      audio.src = streamUrl;
      audio.addEventListener('loadedmetadata', () => {
        seekToLive();
      }, { once: true });

      const playPromise = audio.play();
      if (playPromise !== undefined) {
        playPromise.then(() => {
          if (!isWallMuted) initAudioAnalyser();
        }).catch(() => {
          if (!isWallMuted) {
            tapOverlay.style.display = 'flex';
          }
        });
      }
    }

    tapOverlay.addEventListener('click', () => {
      tapOverlay.style.display = 'none';
      initAudioAnalyser();
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      seekToLive();
      audio.play().catch(() => {});
    });

    renderVisualizer();
  </script>
</body>
</html>
