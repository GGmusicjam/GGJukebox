<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SL Synced DJ Deck</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #040508;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      padding: 14px;
      overflow: hidden;
      user-select: none;
      cursor: pointer;
    }

    .deck-frame {
      width: 100%;
      height: 100%;
      border: 4px solid #ff0044;
      border-radius: 22px;
      background-color: #0a0b12;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 16px 22px;
      position: relative;
      box-shadow: 0 0 25px rgba(255, 0, 68, 0.35);
      transition: box-shadow 0.15s ease, border-color 0.15s ease;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 0 4px;
      gap: 10px;
    }

    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 16px;
      background-color: #ff0044;
      border-radius: 20px;
      box-shadow: 0 0 15px rgba(255, 0, 68, 0.6);
      white-space: nowrap;
    }

    .pulse-dot {
      width: 10px;
      height: 10px;
      background-color: #ffffff;
      border-radius: 50%;
    }

    .station-text {
      color: #ffffff;
      font-size: 1rem;
      letter-spacing: 2px;
      font-weight: bold;
    }

    .top-right-meta {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .vol-controls {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: #14111f;
      border: 1px solid #35274d;
      padding: 4px 12px;
      border-radius: 16px;
    }

    #muteBtn {
      background: none;
      border: none;
      color: #00f0ff;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 0 2px;
      line-height: 1;
      transition: transform 0.1s ease, color 0.15s ease;
    }

    #muteBtn:hover {
      transform: scale(1.15);
    }

    #muteBtn.muted {
      color: #ff0044;
    }

    #volSlider {
      -webkit-appearance: none;
      appearance: none;
      width: 90px;
      height: 6px;
      background: #261d38;
      border-radius: 4px;
      outline: none;
      cursor: pointer;
    }

    #volSlider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #00f0ff;
      box-shadow: 0 0 8px #00f0ff;
      cursor: pointer;
    }

    #volSlider::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border: none;
      border-radius: 50%;
      background: #00f0ff;
      box-shadow: 0 0 8px #00f0ff;
      cursor: pointer;
    }

    .vol-badge {
      font-size: 0.9rem;
      color: #00f0ff;
      font-weight: bold;
      letter-spacing: 0.5px;
      min-width: 40px;
      text-align: right;
    }

    .sync-counter {
      font-size: 1.05rem;
      color: #b537f2;
      font-weight: bold;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .mid-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 0 10px;
      gap: 20px;
      margin: 4px 0;
    }

    #title {
      font-size: 2.1rem;
      font-weight: 900;
      color: #ffffff;
      line-height: 1.15;
      text-transform: uppercase;
      word-break: break-word;
      text-shadow: 0 0 16px rgba(181, 55, 242, 0.8);
      flex: 1;
    }

    .gg-emblem-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 76px;
      height: 76px;
      min-width: 76px;
      margin-right: 25px;
      border-radius: 50%;
      border: 3px solid #ff0044;
      background: radial-gradient(circle at 35% 35%, #3d0a47 0%, #0d0718 100%);
      box-shadow: 0 0 20px rgba(255, 0, 68, 0.7), inset 0 0 15px rgba(157, 0, 255, 0.6);
      position: relative;
      transform-origin: center center;
    }

    .gg-emblem-wrap::before {
      content: '';
      position: absolute;
      width: 88px;
      height: 88px;
      border-radius: 50%;
      border: 2px dashed #9d00ff;
      opacity: 0.8;
    }

    .gg-emblem-text {
      font-family: 'Arial Black', Impact, sans-serif;
      font-size: 2.1rem;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 2px;
      text-shadow: 0 0 10px #ff0044, 0 0 20px #9d00ff, 0 0 30px #00f0ff;
    }

    #visualStage {
      width: 100%;
      height: 250px;
      background-color: #040508;
      border: 2px solid #23192d;
      border-radius: 12px;
      display: block;
    }

    .progress-wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 7px;
      background-color: #181422;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(to right, #ff0044, #9d00ff);
      border-radius: 4px;
      transition: width 0.3s linear;
    }

    .bottom-info {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 0.95rem;
      font-weight: bold;
      color: #79718a;
    }

    #clickOverlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(4, 5, 8, 0.94);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 20px;
      z-index: 100;
    }

    .click-btn {
      background: linear-gradient(135deg, #ff0044, #9d00ff);
      color: #ffffff;
      font-size: 1.9rem;
      padding: 18px 38px;
      border-radius: 18px;
      border: 3px solid #ffffff;
      text-transform: uppercase;
      font-weight: 900;
      letter-spacing: 2px;
      box-shadow: 0 0 35px rgba(255, 0, 68, 0.8);
    }
  </style>
</head>
<body onclick="handleUserUnlock()">

  <div class="deck-frame" id="frameBox">
    <div id="clickOverlay" style="display: none;">
      <div class="click-btn">🔊 CLICK TO TUNE IN</div>
    </div>

    <div class="top-bar">
      <div class="badge-pill">
        <div class="pulse-dot"></div>
        <span class="station-text">LIVE STREAM</span>
      </div>

      <div class="top-right-meta">
        <div class="vol-controls" id="volControlsBox" onclick="event.stopPropagation()">
          <button id="muteBtn" type="button" title="Mute / Unmute" onclick="toggleMute(event)">🔊</button>
          <input id="volSlider" type="range" min="0" max="100" value="100" oninput="onSliderInput(this.value)" onclick="event.stopPropagation()">
          <span class="vol-badge" id="volDisplay">100%</span>
        </div>
        <div class="sync-counter" id="timeDisplay">0:00 / 0:00</div>
      </div>
    </div>

    <div class="mid-header-row">
      <div id="title">JUKEBOX STANDBY</div>
      <div class="gg-emblem-wrap" id="ggBadge">
        <span class="gg-emblem-text">GG</span>
      </div>
    </div>

    <canvas id="visualStage" width="800" height="340"></canvas>

    <div class="progress-wrap">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
      <div class="bottom-info">
        <span id="status">SYNCHRONIZED BROADCAST ACTIVE</span>
        <span>GG AUDIO ENGINE</span>
      </div>
    </div>
  </div>

  <audio id="player" preload="auto"></audio>

  <script>
    var params = new URLSearchParams(window.location.search);
    var audioUrl = params.get('url');
    var songName = params.get('name') || "Now Playing";
    var startTime = parseFloat(params.get('t') || "0");
    var volParam = parseFloat(params.get('vol'));
    var forceSilentDisplay = params.get('mute') === '1';

    var savedPersonalVol = null;
    var savedMuted = false;
    try {
      savedPersonalVol = localStorage.getItem('ggjukebox_personal_vol');
      savedMuted = localStorage.getItem('ggjukebox_personal_muted') === '1';
    } catch (e) {}

    var initialPct = 100;
    if (savedPersonalVol !== null && !isNaN(parseFloat(savedPersonalVol))) {
      initialPct = parseFloat(savedPersonalVol);
    } else if (!isNaN(volParam)) {
      initialPct = Math.max(0, Math.min(100, volParam));
    }

    var targetVol = initialPct / 100;
    var isMuted = forceSilentDisplay ? true : savedMuted;
    var preMuteVol = targetVol > 0 ? targetVol : 0.75;

    var audio = document.getElementById('player');
    audio.crossOrigin = "anonymous";

    var titleEl = document.getElementById('title');
    var statusEl = document.getElementById('status');
    var timeDisplay = document.getElementById('timeDisplay');
    var volDisplay = document.getElementById('volDisplay');
    var volSlider = document.getElementById('volSlider');
    var muteBtn = document.getElementById('muteBtn');
    var volControlsBox = document.getElementById('volControlsBox');
    var progressFill = document.getElementById('progressFill');
    var overlayEl = document.getElementById('clickOverlay');
    var frameBox = document.getElementById('frameBox');
    var ggBadge = document.getElementById('ggBadge');
    var canvas = document.getElementById('visualStage');
    var ctx = canvas.getContext('2d');

    if (forceSilentDisplay && volControlsBox) {
      volControlsBox.style.display = 'none';
    }

    var NUM_BARS = 22;
    var peaks = new Array(NUM_BARS).fill(0);
    var currentHeights = new Array(NUM_BARS).fill(6);
    var smoothedKick = 0;
    var seekDone = false;

    var audioCtx = null;
    var analyser = null;
    var gainNode = null;
    var sourceNode = null;
    var freqData = null;

    function applyVolume() {
      var effectiveVol = (forceSilentDisplay || isMuted) ? 0 : targetVol;
      var displayPct = Math.round(effectiveVol * 100);

      if (gainNode) {
        gainNode.gain.value = effectiveVol;
      } else {
        audio.volume = effectiveVol;
      }

      if (volSlider) volSlider.value = displayPct;
      if (volDisplay) volDisplay.textContent = displayPct + "%";

      if (muteBtn) {
        if (isMuted || displayPct === 0) {
          muteBtn.textContent = "🔇";
          muteBtn.classList.add("muted");
        } else if (displayPct < 50) {
          muteBtn.textContent = "🔉";
          muteBtn.classList.remove("muted");
        } else {
          muteBtn.textContent = "🔊";
          muteBtn.classList.remove("muted");
        }
      }
    }

    function onSliderInput(val) {
      if (forceSilentDisplay) return;
      var pct = Math.max(0, Math.min(100, parseFloat(val)));
      targetVol = pct / 100;
      isMuted = (pct === 0);
      if (targetVol > 0) preMuteVol = targetVol;

      try {
        localStorage.setItem('ggjukebox_personal_vol', String(pct));
        localStorage.setItem('ggjukebox_personal_muted', isMuted ? '1' : '0');
      } catch (e) {}

      applyVolume();
    }

    function toggleMute(e) {
      if (e) e.stopPropagation();
      if (forceSilentDisplay) return;
      if (isMuted) {
        isMuted = false;
        if (targetVol <= 0) targetVol = preMuteVol;
      } else {
        if (targetVol > 0) preMuteVol = targetVol;
        isMuted = true;
      }

      try {
        localStorage.setItem('ggjukebox_personal_vol', String(Math.round(targetVol * 100)));
        localStorage.setItem('ggjukebox_personal_muted', isMuted ? '1' : '0');
      } catch (err) {}

      applyVolume();
    }

    applyVolume();

    function initAudioContext() {
      if (audioCtx) return;
      try {
        var AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        analyser.smoothingTimeConstant = 0.80;

        gainNode = audioCtx.createGain();
        gainNode.gain.value = (forceSilentDisplay || isMuted) ? 0 : targetVol;

        sourceNode = audioCtx.createMediaElementSource(audio);
        sourceNode.connect(analyser);
        analyser.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        freqData = new Uint8Array(analyser.frequencyBinCount);
      } catch (err) {
        console.warn("Web Audio API CORS notice:", err);
        audio.volume = (forceSilentDisplay || isMuted) ? 0 : targetVol;
      }
    }

    function formatTime(sec) {
      if (isNaN(sec) || sec < 0) return "0:00";
      var h = Math.floor(sec / 3600);
      var m = Math.floor((sec % 3600) / 60);
      var s = Math.floor(sec % 60);
      if (h > 0) {
        return h + ":" + (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
      }
      return m + ":" + (s < 10 ? "0" : "") + s;
    }

    function render() {
      ctx.fillStyle = '#040508';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      var hasRealAudio = false;
      var kickDrumVal = 0;

      if (analyser && !audio.paused) {
        analyser.getByteFrequencyData(freqData);
        kickDrumVal = Math.max(freqData[0], freqData[1]);
        if (kickDrumVal > 0 || freqData[3] > 0) hasRealAudio = true;
      }

      var normKick = kickDrumVal / 255;
      if (normKick < 0.22) {
        normKick = 0;
      } else {
        normKick = (normKick - 0.22) / 0.78;
      }

      var targetKickPunch = Math.pow(normKick, 2.2);
      smoothedKick += (targetKickPunch - smoothedKick) * 0.16;

      var pulseScale = 1.0 + (smoothedKick * 0.30);
      ggBadge.style.transform = "scale(" + pulseScale.toFixed(3) + ")";

      if (kickDrumVal > 200) {
        ggBadge.style.borderColor = '#00f0ff';
        ggBadge.style.boxShadow = "0 0 28px #00f0ff, 0 0 45px #ff0044";
      } else {
        ggBadge.style.borderColor = (kickDrumVal > 120) ? '#ff0044' : '#9d00ff';
        ggBadge.style.boxShadow = "0 0 " + Math.floor(smoothedKick * 24 + 8) + "px rgba(255, 0, 68, 0.7)";
      }

      var frameGlow = Math.floor(smoothedKick * 28) + 10;
      frameBox.style.boxShadow = "0 0 " + frameGlow + "px rgba(255, 0, 68, 0.35)";

      var spacing = 8;
      var totalSpacing = spacing * (NUM_BARS + 1);
      var barWidth = (canvas.width - totalSpacing) / NUM_BARS;
      var maxBarHeight = canvas.height - 40;

      for (var i = 0; i < NUM_BARS; i++) {
        var targetHeight = 6;
        var riseRate = 0.22;
        var fallRate = 0.86;

        if (!audio.paused) {
          if (hasRealAudio) {
            var rawVal = 0;

            if (i <= 3) {
              rawVal = freqData[i] || 0;
              var nKick = rawVal / 255;
              nKick = (nKick < 0.26) ? 0 : (nKick - 0.26) / 0.74;
              targetHeight = 6 + Math.pow(nKick, 2.4) * (maxBarHeight * 0.84);
              riseRate = 0.30;
              fallRate = (currentHeights[i] * 0.11) + 3.6;
            }
            else if (i <= 6) {
              var bassBin = 3 + (i - 3);
              rawVal = freqData[bassBin] || 0;
              var nBass = rawVal / 255;
              nBass = (nBass < 0.18) ? 0 : (nBass - 0.18) / 0.82;
              targetHeight = 6 + Math.pow(nBass, 1.8) * maxBarHeight;
              riseRate = 0.32;
              fallRate = (currentHeights[i] * 0.08) + 3.0;
            }
            else if (i <= 13) {
              var snareBin = 7 + (i - 7) * 2;
              rawVal = freqData[snareBin] || 0;
              var nSnare = rawVal / 255;
              nSnare = (nSnare < 0.14) ? 0 : (nSnare - 0.14) / 0.86;
              targetHeight = 6 + Math.pow(nSnare, 2.0) * maxBarHeight;
              riseRate = 0.32;
              fallRate = (currentHeights[i] * 0.07) + 2.8;
            }
            else {
              var hatBin = 21 + Math.floor((i - 14) * 4.5);
              rawVal = freqData[hatBin] || 0;
              var nHat = rawVal / 255;
              nHat = (nHat < 0.10) ? 0 : (nHat - 0.10) / 0.90;
              targetHeight = 6 + Math.pow(nHat, 1.5) * maxBarHeight;
              riseRate = 0.18;
              fallRate = 2.0;
            }

          } else {
            targetHeight = 6 + Math.abs(Math.sin((Date.now() * 0.002) + (i * 0.25))) * 32;
          }
        }

        if (targetHeight > currentHeights[i]) {
          currentHeights[i] += (targetHeight - currentHeights[i]) * riseRate;
        } else {
          currentHeights[i] -= fallRate;
          if (currentHeights[i] < 6) currentHeights[i] = 6;
        }

        if (currentHeights[i] >= peaks[i]) {
          peaks[i] = currentHeights[i];
        } else {
          peaks[i] -= 1.3;
          if (peaks[i] < 6) peaks[i] = 6;
        }

        var x = spacing + i * (barWidth + spacing);
        var y = canvas.height - currentHeights[i] - 8;

        ctx.fillStyle = (i % 2 === 0) ? '#ff0044' : '#9d00ff';
        ctx.fillRect(x, y, barWidth, currentHeights[i]);

        if (peaks[i] > 10) {
          ctx.fillStyle = '#ffffff';
          var peakY = canvas.height - peaks[i] - 12;
          if (peakY < 6) peakY = 6;
          ctx.fillRect(x, peakY, barWidth, 3);
        }
      }

      if (audio.duration && !isNaN(audio.duration)) {
        var pct = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = pct + "%";
        timeDisplay.textContent = formatTime(audio.currentTime) + " / " + formatTime(audio.duration);
      }

      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);

    function startPlayback() {
      initAudioContext();
      applyVolume();

      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      audio.play().then(function() {
        overlayEl.style.display = "none";
        statusEl.textContent = forceSilentDisplay ? "VISUAL DISPLAY MODE (HUD AUDIO)" : "SYNCHRONIZED BROADCAST ACTIVE";
      }).catch(function() {
        if (!forceSilentDisplay) {
          overlayEl.style.display = "flex";
          statusEl.textContent = "CLICK SCREEN TO UNMUTE";
        }
      });
    }

    function handleUserUnlock() {
      startPlayback();
    }

    if (audioUrl) {
      titleEl.textContent = decodeURIComponent(songName);

      var streamUrl = audioUrl
        .replace("www.dropbox.com", "dl.dropboxusercontent.com")
        .replace("?dl=0", "")
        .replace("&dl=0", "");

      if (streamUrl.indexOf("dl.dropboxusercontent.com") !== -1 && streamUrl.indexOf("?") === -1) {
        streamUrl += "?raw=1";
      }

      audio.src = streamUrl;

      audio.addEventListener('loadedmetadata', function() {
        if (!seekDone && startTime > 0 && !isNaN(startTime)) {
          audio.currentTime = startTime;
          seekDone = true;
        }
        startPlayback();
      });

      audio.addEventListener('canplay', function() {
        if (!seekDone && startTime > 0 && !isNaN(startTime)) {
          audio.currentTime = startTime;
          seekDone = true;
        }
      });
    }
  </script>
</body>
</html>
