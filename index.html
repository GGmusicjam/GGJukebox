<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SL Synced DJ Deck</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #06070a;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      padding: 16px;
      overflow: hidden;
      user-select: none;
      cursor: pointer;
    }

    /* Main Deck Frame with Reactive Glow */
    .deck-frame {
      width: 100%;
      height: 100%;
      border: 4px solid #00f0ff;
      border-radius: 24px;
      background-color: #0d1017;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      position: relative;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.25);
      transition: box-shadow 0.08s ease, border-color 0.08s ease;
    }

    /* Top Badge & Live Indicator */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 0 10px;
    }

    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 6px 18px;
      background-color: #ff0077;
      border-radius: 20px;
      box-shadow: 0 0 15px rgba(255, 0, 119, 0.5);
    }

    .pulse-dot {
      width: 12px;
      height: 12px;
      background-color: #ffffff;
      border-radius: 50%;
    }

    .station-text {
      color: #ffffff;
      font-size: 1.1rem;
      letter-spacing: 2px;
      font-weight: bold;
    }

    .sync-counter {
      font-size: 1rem;
      color: #00f0ff;
      font-weight: bold;
      letter-spacing: 1px;
    }

    /* Song Title */
    #title {
      font-size: 2.3rem;
      font-weight: 900;
      color: #ffffff;
      text-align: center;
      line-height: 1.15;
      text-transform: uppercase;
      word-break: break-word;
      max-width: 95%;
      margin: 6px 0;
      text-shadow: 0 0 18px rgba(0, 240, 255, 0.6);
    }

    /* Canvas Stage for Visualizer & Ring */
    #visualStage {
      width: 100%;
      height: 140px;
      background-color: #050608;
      border: 2px solid #1c2233;
      border-radius: 14px;
      display: block;
    }

    /* Timeline Progress Bar */
    .progress-wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background-color: #1a1e2b;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(to right, #00f0ff, #ff0077);
      border-radius: 4px;
      transition: width 0.3s linear;
    }

    .bottom-info {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 1rem;
      font-weight: bold;
      color: #798ba3;
    }

    /* Interaction Overlay (For Friends if Autoplay is Muted) */
    #clickOverlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(6, 7, 10, 0.94);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 20px;
      z-index: 100;
    }

    .click-btn {
      background-color: #ff0077;
      color: #ffffff;
      font-size: 2rem;
      padding: 20px 42px;
      border-radius: 20px;
      border: 4px solid #ffffff;
      text-transform: uppercase;
      font-weight: 900;
      letter-spacing: 2px;
      box-shadow: 0 0 40px rgba(255, 0, 119, 0.8);
      animation: pulseBtn 1.5s infinite ease-in-out;
    }

    @keyframes pulseBtn {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
  </style>
</head>
<body onclick="handleUserUnlock()">

  <div class="deck-frame" id="frameBox">
    <!-- Click to Tune In Modal (For Visitors) -->
    <div id="clickOverlay" style="display: none;">
      <div class="click-btn">🔊 CLICK TO TUNE IN</div>
    </div>

    <!-- Top Status Header -->
    <div class="top-bar">
      <div class="badge-pill">
        <div class="pulse-dot"></div>
        <span class="station-text">LIVE BROADCAST</span>
      </div>
      <div class="sync-counter" id="timeDisplay">0:00 / 0:00</div>
    </div>

    <!-- Song Title -->
    <div id="title">JUKEBOX STANDBY</div>

    <!-- Reactive Audio Canvas -->
    <canvas id="visualStage" width="800" height="180"></canvas>

    <!-- Progress Timeline -->
    <div class="progress-wrap">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
      <div class="bottom-info">
        <span id="status">SYNCHRONIZED DECK ACTIVE</span>
        <span>SL AUDIO ENGINE</span>
      </div>
    </div>
  </div>

  <audio id="player" preload="auto"></audio>

  <script>
    var params = new URLSearchParams(window.location.search);
    var audioUrl = params.get('url');
    var songName = params.get('name') || "Now Playing";
    var startTime = parseFloat(params.get('t') || "0");

    var audio = document.getElementById('player');
    var titleEl = document.getElementById('title');
    var statusEl = document.getElementById('status');
    var timeDisplay = document.getElementById('timeDisplay');
    var progressFill = document.getElementById('progressFill');
    var overlayEl = document.getElementById('clickOverlay');
    var frameBox = document.getElementById('frameBox');
    var canvas = document.getElementById('visualStage');
    var ctx = canvas.getContext('2d');

    // Visualizer variables
    var NUM_BARS = 22;
    var peaks = new Array(NUM_BARS).fill(0);
    var syntheticHeights = new Array(NUM_BARS).fill(15);

    // Web Audio API Context & Analyser
    var audioCtx = null;
    var analyser = null;
    var source = null;
    var freqData = null;
    var isAudioContextReady = false;

    function initAudioContext() {
      if (isAudioContextReady) return;
      try {
        var AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 64;
          analyser.smoothingTimeConstant = 0.8;
          freqData = new Uint8Array(analyser.frequencyBinCount);

          audio.crossOrigin = "anonymous";
          source = audioCtx.createMediaElementSource(audio);
          source.connect(analyser);
          analyser.connect(audioCtx.destination);
          isAudioContextReady = true;
        }
      } catch (e) {
        // Fallback gracefully if CORS prevents MediaElementSource
        isAudioContextReady = false;
      }
    }

    function formatTime(sec) {
      if (isNaN(sec) || sec < 0) return "0:00";
      var m = Math.floor(sec / 60);
      var s = Math.floor(sec % 60);
      return m + ":" + (s < 10 ? "0" : "") + s;
    }

    function render() {
      ctx.fillStyle = '#050608';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      var hasRealData = false;
      var bassLevel = 0;

      // Extract real-time frequency data if available
      if (isAudioContextReady && analyser && !audio.paused) {
        analyser.getByteFrequencyData(freqData);
        var sum = 0;
        for (var k = 0; k < freqData.length; k++) { sum += freqData[k]; }
        if (sum > 0) {
          hasRealData = true;
          bassLevel = (freqData[0] + freqData[1] + freqData[2]) / 3;
        }
      }

      // Dynamic Frame Border Glow based on Bass hits
      var glowIntensity = Math.floor((bassLevel / 255) * 45) + 15;
      frameBox.style.boxShadow = "0 0 " + glowIntensity + "px rgba(0, 240, 255, 0.4)";

      // Draw Center Pulse Ring
      var centerX = canvas.width / 2;
      var centerY = canvas.height / 2;
      var ringRadius = 25 + (bassLevel / 255) * 20;

      ctx.strokeStyle = (bassLevel > 140) ? '#ff0077' : '#00f0ff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(centerX, centerY, ringRadius, 0, Math.PI * 2);
      ctx.stroke();

      // Render 22 Equalizer Bars with Peak Hold
      var spacing = 8;
      var totalSpacing = spacing * (NUM_BARS + 1);
      var barWidth = (canvas.width - totalSpacing) / NUM_BARS;

      for (var i = 0; i < NUM_BARS; i++) {
        var barHeight = 10;

        if (hasRealData) {
          var dataIndex = Math.floor((i / NUM_BARS) * freqData.length);
          var val = freqData[dataIndex] || 0;
          barHeight = (val / 255) * (canvas.height - 35) + 8;
        } else {
          // Synthetic beat bounce if audio is silent or CORS isolated
          if (!audio.paused && Math.random() > 0.3) {
            syntheticHeights[i] = Math.floor(Math.random() * (canvas.height - 40)) + 12;
          } else if (audio.paused) {
            syntheticHeights[i] = 8;
          }
          barHeight = syntheticHeights[i];
        }

        // Peak Hold logic
        if (barHeight > peaks[i]) {
          peaks[i] = barHeight;
        } else {
          peaks[i] -= 2.2; // Smooth peak gravity fall
          if (peaks[i] < 0) peaks[i] = 0;
        }

        var x = spacing + i * (barWidth + spacing);
        var y = canvas.height - barHeight - 8;

        // Equalizer Bar (Cyan/Magenta Alternating)
        ctx.fillStyle = (i % 2 === 0) ? '#00f0ff' : '#ff0077';
        ctx.fillRect(x, y, barWidth, barHeight);

        // Floating Peak Cap
        ctx.fillStyle = '#ffffff';
        var peakY = canvas.height - peaks[i] - 12;
        if (peakY < 5) peakY = 5;
        ctx.fillRect(x, peakY, barWidth, 4);
      }

      // Update Timeline & Counter
      if (audio.duration && !isNaN(audio.duration)) {
        var pct = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = pct + "%";
        timeDisplay.textContent = formatTime(audio.currentTime) + " / " + formatTime(audio.duration);
      }

      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);

    function startPlayback() {
      initAudioContext();
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      if (startTime > 0 && !isNaN(startTime)) {
        audio.currentTime = startTime;
      }

      audio.play().then(function() {
        overlayEl.style.display = "none";
        statusEl.textContent = "SYNCHRONIZED BROADCAST ACTIVE";
      }).catch(function() {
        overlayEl.style.display = "flex";
        statusEl.textContent = "CLICK SCREEN TO UNMUTE";
      });
    }

    function handleUserUnlock() {
      startPlayback();
    }

    if (audioUrl) {
      titleEl.textContent = decodeURIComponent(songName);
      audio.src = audioUrl;

      audio.addEventListener('loadedmetadata', function() {
        startPlayback();
      }, { once: true });
    }
  </script>
</body>
</html>
